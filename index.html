<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8fa">
  <title>Chalie's Tools</title>
  <style>
    :root{
      --bg:#f7f8fa;
      --card:#ffffff;
      --text:#1f2937;
      --muted:#6b7280;
      --line:#e5e7eb;
      --hover:#f9fafb;
      --shadow:0 6px 20px rgba(15,23,42,.07);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body{
      padding:28px 16px 48px;
    }

    .container{
      width:min(720px,100%);
      margin:0 auto;
    }

    header{
      margin-bottom:22px;
    }

    h1{
      margin:0;
      font-size:clamp(30px,5vw,44px);
      letter-spacing:-.045em;
      line-height:1;
      cursor:default;
      user-select:none;
    }

    .subtitle{
      margin:8px 0 0;
      color:var(--muted);
      font-size:14px;
    }

    .tools{
      display:grid;
      gap:12px;
    }

    .tool{
      display:grid;
      grid-template-columns:46px minmax(0,1fr) 24px;
      align-items:center;
      gap:14px;
      min-height:78px;
      padding:15px 16px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--card);
      box-shadow:var(--shadow);
      color:var(--text);
      text-decoration:none;
      transition:background-color .14s ease,border-color .14s ease;
    }

    .tool:hover{
      background:var(--hover);
      border-color:#d1d5db;
    }

    .icon{
      width:46px;
      height:46px;
      display:grid;
      place-items:center;
      border-radius:12px;
      color:#fff;
      font-size:21px;
      font-weight:900;
    }

    .tool-copy{
      min-width:0;
    }

    .tool-name{
      font-size:16px;
      font-weight:800;
      line-height:1.2;
    }

    .tool-desc{
      margin-top:5px;
      color:var(--muted);
      font-size:13px;
      line-height:1.35;
    }

    .arrow{
      color:#9ca3af;
      font-size:22px;
      text-align:right;
    }

    .hidden-tool{
      display:none;
    }

    .hidden-tool.show{
      display:grid;
    }

    footer{
      margin-top:28px;
      padding-top:18px;
      border-top:1px solid var(--line);
      color:var(--muted);
      font-size:12px;
      text-align:center;
    }

    @media(max-width:560px){
      body{padding-top:22px}
      .tool{
        grid-template-columns:42px minmax(0,1fr) 20px;
        min-height:72px;
        padding:13px 14px;
      }
      .icon{
        width:42px;
        height:42px;
        font-size:19px;
      }
      .tool-name{font-size:15px}
      .tool-desc{font-size:12px}
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <h1 id="secretTitle">Chalie's Tools</h1>
      <p class="subtitle">Simple tools and links in one place.</p>
    </header>

    <section class="tools">
      <a class="tool" href="/groceries/">
        <div class="icon" style="background:linear-gradient(145deg,#2563eb,#1d4ed8)">🛒</div>
        <div class="tool-copy">
          <div class="tool-name">Shopping List</div>
          <div class="tool-desc">Create and manage grocery lists.</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="tool" href="https://suno.com/@cshain" target="_blank" rel="noopener">
        <div class="icon" style="background:linear-gradient(145deg,#ec4899,#8b5cf6)">♫</div>
        <div class="tool-copy">
          <div class="tool-name">Suno Music</div>
          <div class="tool-desc">Listen to my music on Suno.</div>
        </div>
        <div class="arrow">↗</div>
      </a>

      <a class="tool hidden-tool" href="/budget/">
        <div class="icon" style="background:linear-gradient(145deg,#0ea5e9,#2563eb)">$</div>
        <div class="tool-copy">
          <div class="tool-name">Budget Planner</div>
          <div class="tool-desc">Plan income, expenses, and savings.</div>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="tool hidden-tool" href="/qwikpen/">
        <div class="icon" style="background:linear-gradient(145deg,#14b8a6,#0f766e)">✚</div>
        <div class="tool-copy">
          <div class="tool-name">QwikPen Click Calculator</div>
          <div class="tool-desc">Calculate clicks for a selected dose.</div>
        </div>
        <div class="arrow">›</div>
      </a>
    </section>

    <footer>© <span id="year"></span> Chalie's Tools</footer>
  </main>

  <script>
    const secretTitle = document.getElementById("secretTitle");
    const hiddenTools = [...document.querySelectorAll(".hidden-tool")];

    let clicks = 0;
    let clickTimer;

    function setHiddenToolsVisible(show){
      hiddenTools.forEach(tool => tool.classList.toggle("show",show));
      localStorage.setItem("chaliesHiddenToolsVisible",show ? "yes" : "no");
    }

    const savedSetting =
      localStorage.getItem("chaliesHiddenToolsVisible") === "yes";

    setHiddenToolsVisible(savedSetting);

    secretTitle.addEventListener("click",()=>{
      clicks++;
      clearTimeout(clickTimer);

      if(clicks >= 3){
        const showing = hiddenTools.some(tool => tool.classList.contains("show"));
        setHiddenToolsVisible(!showing);
        clicks = 0;
        return;
      }

      clickTimer = setTimeout(()=>{
        clicks = 0;
      },1200);
    });

    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
