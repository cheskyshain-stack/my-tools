<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // If this page ever ends up loaded inside its own iframe (e.g. a sub-page's
  // "back to home" link was clicked from inside the shell below), swap
  // straight to the real home content instead of nesting the shell inside
  // itself. Must run before anything else paints.
  if (window.self !== window.top) { location.replace("/home/"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="CJ Portal - smart tools and games. Shopping list, budget planner, QR codes, Braille, stopwatch, chess, sudoku and more.">
<title>CJ Portal</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CJ Portal">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#080b12;overflow:hidden;overscroll-behavior-y:none}
  #shellFrame{
    border:0;width:100%;display:block;background:#080b12;
    height:100vh;height:100dvh;height:var(--shell-h,100dvh);
  }
</style>
</head>
<body>
  <iframe id="shellFrame" src="/home/" title="CJ Portal"></iframe>

<script>
/* The frame must be exactly as tall as what the person can see.
   Sized in vh it is the height WITHOUT the address bar, so on Android the
   bottom of the tool hangs below the fold, and this page cannot scroll to it
   because it is overflow:hidden. The bottom of every tool was quietly
   unreachable. visualViewport.height is the only number that means "on
   screen", so drive the frame from that. */
(function () {
  const root = document.documentElement;
  const vv = window.visualViewport;
  let frame = 0;
  function size() {
    cancelAnimationFrame(frame);
    frame = requestAnimationFrame(function () {
      const h = Math.round((vv && vv.height) || window.innerHeight || 0);
      if (h > 0) { root.style.setProperty("--shell-h", h + "px"); }
    });
  }
  if (vv) {
    vv.addEventListener("resize", size);
    vv.addEventListener("scroll", size);
  }
  window.addEventListener("resize", size);
  window.addEventListener("orientationchange", size);
  size();
}());

const $ = id => document.getElementById(id);
const iframe = $("shellFrame");

/* ===== URL mirroring so Back/Forward stay inside the shell =====
   Sub-pages navigate the iframe on their own (normal <a> clicks work as
   usual inside it); this just mirrors the iframe's URL into the real
   address bar with pushState/replaceState, and mirrors it back on
   Back/Forward via popstate - so the browser's own history controls feel
   normal while every page keeps running in its own isolated document. */
let firstLoad = true;
let suppressPush = false;

iframe.addEventListener("load", () => {
  try{
    const path = iframe.contentWindow.location.pathname;
    const displayPath = path === "/home/" ? "/" : path;
    if (suppressPush){
      suppressPush = false;
    } else if (firstLoad){
      history.replaceState({ cjPath: path }, "", displayPath);
    } else {
      history.pushState({ cjPath: path }, "", displayPath);
    }
    firstLoad = false;
    if (iframe.contentDocument && iframe.contentDocument.title) document.title = iframe.contentDocument.title;
  }catch(e){ /* same-origin always expected; ignore defensively */ }
});

window.addEventListener("popstate", (e) => {
  const target = (e.state && e.state.cjPath) || "/home/";
  suppressPush = true;
  iframe.src = target;
});
</script>
</body>
</html>
