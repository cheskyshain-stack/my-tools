<!DOCTYPE html>
<html lang="en">
<head>
<script>
  // If this page ever ends up loaded inside its own iframe (e.g. a sub-page's
  // "back to home" link was clicked from inside the shell below), swap
  // straight to the real home content instead of nesting the shell inside
  // itself. Must run before anything else paints.
  if (window.self !== window.top) { location.replace("/home/"); }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="CJ Portal — smart tools and games. Shopping list, budget planner, QR codes, Braille, chess, sudoku and more.">
<title>CJ Portal</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#080b12;overflow:hidden;overscroll-behavior-y:none}
  #shellFrame{border:0;width:100%;height:100vh;height:100dvh;display:block;background:#080b12}
</style>
</head>
<body>
  <iframe id="shellFrame" src="/home/" title="CJ Portal"></iframe>

<script>
const $ = id => document.getElementById(id);
const iframe = $("shellFrame");

/* ===== URL mirroring so Back/Forward stay inside the shell =====
   Sub-pages navigate the iframe on their own (normal <a> clicks work as
   usual inside it); this just mirrors the iframe's URL into the real
   address bar with pushState/replaceState, and mirrors it back on
   Back/Forward via popstate - so the browser's own history controls feel
   normal while every page keeps running in its own isolated document. */
let firstLoad = true;
let suppressPush = false;

iframe.addEventListener("load", () => {
  try{
    const path = iframe.contentWindow.location.pathname;
    const displayPath = path === "/home/" ? "/" : path;
    if (suppressPush){
      suppressPush = false;
    } else if (firstLoad){
      history.replaceState({ cjPath: path }, "", displayPath);
    } else {
      history.pushState({ cjPath: path }, "", displayPath);
    }
    firstLoad = false;
    if (iframe.contentDocument && iframe.contentDocument.title) document.title = iframe.contentDocument.title;
  }catch(e){ /* same-origin always expected; ignore defensively */ }
});

window.addEventListener("popstate", (e) => {
  const target = (e.state && e.state.cjPath) || "/home/";
  suppressPush = true;
  iframe.src = target;
});
</script>
</body>
</html>
