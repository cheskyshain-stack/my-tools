<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b12">
  <title>CJ Apps</title>
  <style>
    :root{--bg:#080b12;--card:#101622;--card-hover:#141c2a;--text:#f8fafc;--muted:#94a3b8;--line:#1f2937;--shadow:0 10px 28px rgba(0,0,0,.28)}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:radial-gradient(circle at 50% -10%,rgba(37,99,235,.16),transparent 30rem),var(--bg);color:var(--text)}
    body{padding:24px 16px 48px}
    .container{width:min(720px,100%);margin:0 auto}
    header{display:flex;justify-content:center;margin-bottom:26px;text-align:center}
    .site-logo{width:min(340px,82vw);height:auto;display:block;border-radius:22px;box-shadow:0 18px 48px rgba(0,0,0,.30);user-select:none;-webkit-user-drag:none;cursor:default}
    .tools{display:grid;gap:12px}
    .tool{display:grid;grid-template-columns:46px minmax(0,1fr) 24px;align-items:center;gap:14px;min-height:78px;padding:15px 16px;border:1px solid var(--line);border-radius:15px;background:var(--card);box-shadow:var(--shadow);color:var(--text);text-decoration:none;transition:background-color .14s ease,border-color .14s ease}
    .tool:hover{background:var(--card-hover);border-color:#334155}
    .icon{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;color:#fff;font-size:21px;font-weight:900}
    .tool-copy{min-width:0}.tool-name{font-size:16px;font-weight:800;line-height:1.2}.tool-desc{margin-top:5px;color:var(--muted);font-size:13px;line-height:1.35}.arrow{color:#64748b;font-size:22px;text-align:right}
    .hidden-tool{display:none}.hidden-tool.show{display:grid}
    footer{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);color:#64748b;font-size:12px;text-align:center}
    @media(max-width:560px){body{padding-top:18px}.site-logo{width:min(300px,90vw);border-radius:18px}.tool{grid-template-columns:42px minmax(0,1fr) 20px;min-height:72px;padding:13px 14px}.icon{width:42px;height:42px;font-size:19px}.tool-name{font-size:15px}.tool-desc{font-size:12px}}
  </style>
</head>
<body>
  <main class="container">
    <header><img id="secretLogo" src="/logo.png" alt="CJ Apps" class="site-logo"></header>
    <section class="tools">
      <a class="tool" href="/groceries/"><div class="icon" style="background:linear-gradient(145deg,#2563eb,#1d4ed8)">🛒</div><div class="tool-copy"><div class="tool-name">Shopping List</div><div class="tool-desc">Create and manage grocery lists.</div></div><div class="arrow">›</div></a>
      <a class="tool" href="https://suno.com/@cshain" target="_blank" rel="noopener"><div class="icon" style="background:linear-gradient(145deg,#8b5cf6,#06b6d4)">♫</div><div class="tool-copy"><div class="tool-name">Suno Music</div><div class="tool-desc">Listen to my music on Suno.</div></div><div class="arrow">↗</div></a>
      <a class="tool hidden-tool" href="/budget/"><div class="icon" style="background:linear-gradient(145deg,#0ea5e9,#2563eb)">$</div><div class="tool-copy"><div class="tool-name">Budget Planner</div><div class="tool-desc">Plan income, expenses, and savings.</div></div><div class="arrow">›</div></a>
      <a class="tool hidden-tool" href="/qwikpen/"><div class="icon" style="background:linear-gradient(145deg,#14b8a6,#0f766e)">✚</div><div class="tool-copy"><div class="tool-name">QwikPen Click Calculator</div><div class="tool-desc">Calculate clicks for a selected dose.</div></div><div class="arrow">›</div></a>
    </section>
    <footer>© <span id="year"></span> CJ Apps</footer>
  </main>
  <script>
    const secretLogo=document.getElementById("secretLogo");
    const hiddenTools=[...document.querySelectorAll(".hidden-tool")];
    let clicks=0,clickTimer;
    function setHiddenToolsVisible(show){hiddenTools.forEach(tool=>tool.classList.toggle("show",show));localStorage.setItem("cjAppsHiddenToolsVisible",show?"yes":"no")}
    setHiddenToolsVisible(localStorage.getItem("cjAppsHiddenToolsVisible")==="yes");
    secretLogo.addEventListener("click",()=>{clicks++;clearTimeout(clickTimer);if(clicks>=3){const showing=hiddenTools.some(tool=>tool.classList.contains("show"));setHiddenToolsVisible(!showing);clicks=0;return}clickTimer=setTimeout(()=>{clicks=0},1200)});
    document.getElementById("year").textContent=new Date().getFullYear();
  </script>
</body>
</html>
