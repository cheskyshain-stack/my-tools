<div class="app">
  <header class="cj-page-header">
    <span class="cj-brand"><img src="/catering/icon.png?v=2" alt="Simcha King"></span>
    <div><h1>Simcha King</h1><p class="subhead">Bris, kiddush, and every detail.</p></div>
    <div class="status" role="status"><span class="dot" id="connection-dot"></span><span class="status-text" id="connection-status">Preparing offline access</span></div>
  </header>
  <div id="company-bar" class="company-bar no-print"></div>
  <nav class="navigation" aria-label="Planner sections">
    <button type="button" data-view="bookings" class="active">Bookings</button>
    <button type="button" data-view="shopping">Shopping list</button>
    <button type="button" data-view="inventory">Inventory</button>
    <button type="button" data-view="suppliers">Suppliers</button>
    <button type="button" data-view="purchases">Supplier orders</button>
    <button type="button" data-view="account">Company & sync</button>
    <button type="button" data-view="customers">Customers</button>
    <button type="button" data-view="templates">Supply templates</button>
    <button type="button" data-view="neighborhoods">Neighborhoods</button>
    <button type="button" data-view="history">Feedback</button>
    <button type="button" data-view="backups">Backups</button>
  </nav>
  <div id="recovery-notice" class="notice" hidden></div>
  <main id="main"></main>
  <p class="footer-note">Saved on this device, in this browser. Download a backup to keep a separate copy.</p>
</div>

<script>
'use strict';
const LEGACY_KEY='cjCateringV1';
let KEY=LEGACY_KEY, BACKUP_KEY='cjCateringLastGoodV1';
const BASIS={table:'Dining table',regular:'Regular table',kids:'Kids table',head:'Head table',coffee:'Coffee station',adults:'Adult guest',children:'Child guest',guests:'Guest',event:'Event',roundTables:'Round dining table',rectangularTables:'Rectangular dining table'};
const KINDS={bris:'Bris',kiddush:'Kiddush'};
const CATEGORIES=['Paper goods','Food','Drinks','Service'];
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID();

function purchaseRow(line={}){const i=stockItem(line.inventoryId);return `<div class="purchase-editor-row" data-line-id="${line.id||uid()}"><label class="field">Inventory item<select data-po-item required><option value="">Choose item</option>${state.inventory.filter(i=>i.active).map(i=>`<option value="${i.id}" ${line.inventoryId===i.id?'selected':''}>${esc(i.name)}</option>`).join('')}</select></label><label class="field">Packs<input data-po-packs type="number" min="1" max="100000000" step="1" required value="${line.packs||1}"></label><label class="field">Units / pack<input data-po-size type="number" min="0.000001" max="100000000" step="any" required value="${line.packSize||i?.packSize||1}"></label><label class="field">$ / pack<input data-po-price type="number" min="0" max="100000000" step=".01" value="${line.price??i?.price??''}"></label><button type="button" class="close" data-action="remove-purchase-line" aria-label="Remove purchase line">×</button></div>`;}
function nextPoNumber(){const prefix='PO-'+today().replaceAll('-','')+'-';let n=1;while(state.purchaseOrders.some(p=>p.number===prefix+String(n).padStart(3,'0')))n++;return prefix+String(n).padStart(3,'0');}
function purchaseDialog(id=null,{supplierId=null,bookingId=null}={}){
 if(!state.suppliers.length){notify('Add a supplier before creating a purchase order.');view='suppliers';selectedPurchase=null;render();return;}
 const old=state.purchaseOrders.find(p=>p.id===id),e=bookingId?eventById(bookingId):null;const p=old||{supplierId:supplierId||state.suppliers[0].id,number:nextPoNumber(),deliveryDate:e?.date||'',deliveryAddress:state.settings.deliveryAddress,notes:'',bookingIds:e?[e.id]:[],items:[]};
 if(e&&!old){for(const [inventoryId,needed] of inventoryRequirements(e)){const stock=stockItem(inventoryId);if(stock.supplierId!==p.supplierId)continue;const free=Math.max(0,stockOnHand(inventoryId)-reservedStock(inventoryId,{excluding:e.id,forEvent:e}));const shortage=Math.max(0,needed-free-incomingStock(inventoryId,{byDate:e.date}));if(shortage>0)p.items.push({id:uid(),inventoryId,packs:Math.ceil(shortage/stock.packSize-1e-10),packSize:stock.packSize,price:stock.price});}}
 const locked=old&&state.movements.some(m=>m.orderId===old.id);
 if(locked){notify('This purchase has receipts. Create another purchase for additional supplies.');return;}
 openDialog(old?'Edit supplier order':'New supplier order',`<form id="purchase-form" data-id="${id||''}"><div class="form-grid"><label class="field">Supplier<select name="supplierId" required>${state.suppliers.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label>${field('Order reference','number',p.number,'text','required maxlength="100"')}${field('Delivery date','deliveryDate',p.deliveryDate,'date')}<label class="field wide">Delivery address<input name="deliveryAddress" value="${esc(p.deliveryAddress)}" maxlength="500"></label><label class="field wide">Linked bookings<select name="bookingIds" multiple size="${Math.min(4,Math.max(2,state.events.length))}" aria-describedby="booking-link-help">${state.events.filter(e=>e.status!=='cancelled').map(e=>`<option value="${e.id}" ${p.bookingIds.includes(e.id)?'selected':''}>${esc(nameOf(e))} · ${dateLabel(e.date)}</option>`).join('')}</select><small id="booking-link-help">Select the bookings this purchase supplies. Use Ctrl or Command for multiple selections on a computer.</small></label></div><h3 style="margin-top:22px">Purchase lines</h3><div id="purchase-lines">${(p.items.length?p.items:[{}]).map(purchaseRow).join('')}</div>${action('add-purchase-line','+ Add line')}<label class="field" style="margin-top:18px">Notes for the supplier<textarea name="notes" maxlength="10000">${esc(p.notes)}</textarea></label>${saveActions('Save supplier order')}</form>`);
 $('#purchase-form [name=supplierId]').value=p.supplierId;

function buildSupplierDraft(p){
 const s=supplier(p.supplierId),company=state.settings.companyName;
 const refs=p.bookingIds.map(id=>{const e=eventById(id);return e?nameOf(e)+' ('+dateLabel(e.date)+')':'';}).filter(Boolean);
 const lines=p.items.map(i=>{const v=stockItem(i.inventoryId);return `- ${v.name}: ${num(i.packs)} pack(s) x ${num(i.packSize)} ${v.unit} = ${num(i.packs*i.packSize)} ${v.unit}${i.price===null?'':'; estimated '+money(i.price)+' per pack'}`;});
 return {subject:`Order request ${p.number} | ${company}`,body:`Hello ${s.name},\n\nPlease arrange the following order for ${company}.\nOrder reference: ${p.number}\n${p.deliveryDate?'Requested delivery: '+dateLabel(p.deliveryDate)+'\n':''}${p.deliveryAddress?'Delivery address: '+p.deliveryAddress+'\n':''}${refs.length?'For: '+refs.join('; ')+'\n':''}\n${lines.join('\n')}\n\n${p.items.some(i=>i.price===null)?'Some prices are not yet known. ':''}Known estimated total: ${money(purchaseTotal(p))}.\nPlease confirm availability, final pricing, and delivery time before processing.\n${p.notes?'\n'+p.notes+'\n':''}\nThank you,\n${company}${state.settings.companyEmail?'\n'+state.settings.companyEmail:''}${state.settings.companyPhone?'\n'+state.settings.companyPhone:''}`};
}
function savePurchase(form){
 const d=new FormData(form),id=form.dataset.id||uid(),old=state.purchaseOrders.find(p=>p.id===id),items=[...form.querySelectorAll('.purchase-editor-row')].map(row=>({id:row.dataset.lineId,inventoryId:row.querySelector('[data-po-item]').value,packs:Number(row.querySelector('[data-po-packs]').value),packSize:Number(row.querySelector('[data-po-size]').value),price:row.querySelector('[data-po-price]').value===''?null:Number(row.querySelector('[data-po-price]').value)}));
 if(!items.length){formError('Add at least one purchase line.');return;}
 if(new Set(items.map(i=>i.inventoryId)).size!==items.length){formError('Use one line per inventory item.');return;}
 const now=new Date().toISOString(),p={id,supplierId:d.get('supplierId'),number:String(d.get('number')).trim(),status:old?.status||'draft',deliveryDate:d.get('deliveryDate'),deliveryAddress:String(d.get('deliveryAddress')).trim(),notes:String(d.get('notes')).trim(),bookingIds:d.getAll('bookingIds'),items,subject:'',body:'',createdAt:old?.createdAt||now,updatedAt:now};
 if(!p.number){formError('Enter an order reference.');return;}Object.assign(p,buildSupplierDraft(p));
 if(transact(s=>{const index=s.purchaseOrders.findIndex(x=>x.id===id);if(index<0)s.purchaseOrders.push(p);else s.purchaseOrders[index]=p;},'Supplier order saved')){closeDialog();view='purchases';selectedPurchase=id;render();}

l')}${action('download-email','Download email (.eml)')}${action('open-email','Open email draft','',true)}</div></form>${p.bookingIds.length?`<div class="panel"><h3>Linked bookings</h3>${p.bookingIds.map(id=>{const e=eventById(id);return `<div class="list-row"><span>${esc(nameOf(e))} · ${dateLabel(e.date)}</span>${action('open-event','Open booking',`data-id="${id}"`)}</div>`;}).join('')}</div>`:''}`;

function dispatchDialog(id){const e=eventById(id);const rows=[...inventoryRequirements(e)].map(([id,qty])=>[id,Math.max(0,qty-stockIssued(e,id))]).filter(([,qty])=>qty>0);if(!rows.length){notify('Link supplies to inventory items before issuing stock.');return;}openDialog('Issue stock for this booking',`<form id="dispatch-form" data-id="${id}"><h3>${esc(nameOf(e))} · ${dateLabel(e.date)}</h3><p class="hint">This deducts stock on hand and releases the booking’s reservation. Packing checkmarks alone do not change inventory.</p>${rows.map(([id,qty])=>{const stock=stockItem(id);return `<label class="field" style="margin:14px 0">${esc(stock.name)} (${esc(stock.unit)}): ${num(stockOnHand(id))} on hand<input data-issue="${id}" type="number" min="0" max="${Math.max(0,Math.min(qty,stockOnHand(id)))}" step="any" value="${Math.max(0,Math.min(qty,stockOnHand(id)))}" required></label>`;}).join('')}${field('Dispatch reference / notes','notes','','text','maxlength="10000"')}${saveActions('Issue stock')}</form>`);}

const CLOTH_CHOICES={unspecified:'Choose later',round:'Round',rectangular:'Rectangular',mixed:'Mixed round and rectangular'};

 let stock=s.inventory.find(i=>i.tableclothShape===shape)||s.inventory.find(i=>i.name.toLowerCase()===name.toLowerCase()&&i.unit==='units');

function updateClothPreview(){const f=$('#event-form');if(!f||!f.elements.tableclothChoice)return;const total=['regular','kids','head'].reduce((n,k)=>n+(Number(f.elements[k].value)||0),0),choice=f.elements.tableclothChoice.value,round=choice==='round'?total:choice==='mixed'?(Number(f.elements.roundTables.value)||0):0,rect=choice==='rectangular'?total:choice==='mixed'?total-round:0;$('#mixed-cloths').hidden=choice!=='mixed';f.elements.roundTables.disabled=choice!=='mixed';f.elements.roundTables.required=choice==='mixed';f.elements.roundTables.max=total;$('#rectangular-cloths').textContent=num(Math.max(0,rect));$('#cloth-preview').textContent=choice==='unspecified'?'The existing unspecified tablecloth quantity stays unchanged.':`${num(round)} round + ${num(Math.max(0,rect))} rectangular dining tables.`;}
function applyClothChoice(s,e,choice,roundCount,old=null){
 if(!Object.hasOwn(CLOTH_CHOICES,choice))throw Error('Choose a valid tablecloth shape.');
 const total=dining(e),round=choice==='round'?total:choice==='mixed'?roundCount:0,rect=choice==='rectangular'?total:choice==='mixed'?total-round:0;
 if(!Number.isInteger(round)||round<0||round>total)throw Error('Round dining tables must be between zero and the total number of dining tables.');
 if(old&&clothHistory(old)&&choice!==(old.tableclothChoice||'unspecified'))throw Error('Tablecloth stock has already been issued. Keep the saved shape and add replacement supplies separately.');
 e.tableclothChoice=choice;e.counts.roundTables=round;e.counts.rectangularTables=rect;
 let sources=e.tableclothSources?.length?structuredClone(e.tableclothSources):e.items.filter(genericTablecloth).map(i=>structuredClone(i));
 if(!sources.length&&choice!=='unspecified'){
  const template=s.templates[e.kind].find(genericTablecloth);
  const source=template?effectiveItem(template,s):{id:'default-cloth-'+e.kind,name:'Tablecloths',category:'Paper goods',basis:'table',rate:1,packSize:1,price:null,unit:'units',inventoryId:null};
  if(!source.inventoryId)createStockFor(s,source);sources=[source];
 }
 const previous=e.items;const sourceIds=new Set(sources.map(i=>i.id));const insertAt=Math.max(0,previous.findIndex(i=>i.clothGenerated||sourceIds.has(i.id)));

 e.items=e.items.filter(i=>!i.clothGenerated&&!sourceIds.has(i.id));const kept=e.items.length;
 if(choice==='unspecified'){e.items.splice(insertAt,0,...sources);if(sources.length)e.tableclothSources=sources;return;}
 e.tableclothSources=sources;
 for(const source of sources){for(const shape of ['round','rectangular']){
  const stock=clothStock(s,shape,source),basis=shape==='round'?'roundTables':'rectangularTables';
  if(e.items.some(i=>i.basis===basis&&i.inventoryId===stock.id))continue;
  const originalId=source.id.length<=70?source.id:'cloth-'+stockHash(source.id),id=originalId+'-'+shape;
  const saved=previous.find(i=>i.id===id&&i.clothGenerated),keep=saved&&old&&(old.tableclothChoice||'unspecified')===choice;
  e.items.push(keep?{...structuredClone(saved),basis}:{...structuredClone(source),id,name:stock.name,basis,inventoryId:stock.id,unit:stock.unit,packSize:stock.packSize,price:stock.price,clothGenerated:true,clothGroup:source.id,clothShape:shape});
 }}
 const generated=e.items.splice(kept);e.items.splice(Math.min(insertAt,e.items.length),0,...generated);
}
function validateCloths(s,ok){for(const e of s.events){

 ok(Object.hasOwn(CLOTH_CHOICES,choice)&&Number.isInteger(round)&&round>=0&&Number.isInteger(rect)&&rect>=0,'Invalid tablecloth choice or table count.');

 if(e.tableclothSources!==undefined)ok(Array.isArray(e.tableclothSources)&&e.tableclothSources.length<=500&&e.tableclothSources.every(i=>i&&genericTablecloth(i)&&typeof i.id==='string'&&/^[\w-]{1,100}$/.test(i.id)&&typeof i.unit==='string'&&Number.isFinite(i.rate)&&i.rate>=0&&Number.isFinite(i.packSize)&&i.packSize>0&&(i.price===null||(Number.isFinite(i.price)&&i.price>=0))&&(i.inventoryId===null||s.inventory.some(v=>v.id===i.inventoryId))),'Invalid saved tablecloth source.');
 }}

function dateOffset(date,days){const d=new Date(date+'T12:00:00');d.setDate(d.getDate()+days);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}

function shoppingKey(){return KEY+':shopping';}
function matchingShoppingBookings(){return state.events.filter(e=>e.status!=='cancelled'&&(shop.includeCompleted||e.status==='booked')&&(!shop.from||e.date>=shop.from)&&(!shop.to||e.date<=shop.to)).sort((a,b)=>a.date.localeCompare(b.date)||nameOf(a).localeCompare(nameOf(b)));}
function ensureShopping(){const shared=cloud.company&&cloud.profile?state.shoppingPlans.find(p=>p.id==='shopping-'+cloud.profile.userId):null;if(shoppingScope===KEY){if(shared&&shop.sharedRevision!==shared.updatedAt)shop={...structuredClone(shared),sharedRevision:shared.updatedAt};return;}shoppingScope=KEY;const range=shoppingRange('next7');shop={preset:'next7',...range,includeCompleted:false,mode:'full',selected:[],checks:{},showCovered:false};let stored=null;try{stored=JSON.parse(localStorage.getItem(shoppingKey())||'null');}catch{}
 if(stored&&['next7','next3','week','all','custom'].includes(stored.preset)&&['full','shortage'].includes(stored.mode)&&Array.isArray(stored.selected)&&stored.selected.every(v=>typeof v==='string')&&typeof stored.from==='string'&&typeof stored.to==='string'&&(!stored.from||/^\d{4}-\d{2}-\d{2}$/.test(stored.from))&&(!stored.to||/^\d{4}-\d{2}-\d{2}$/.test(stored.to))){shop={...shop,...stored,checks:stored.checks&&typeof stored.checks==='object'&&!Array.isArray(stored.checks)?stored.checks:{}};}else shop.selected=matchingShoppingBookings().map(e=>e.id);

function selectedShoppingBookings(){ensureShopping();return state.events.filter(e=>shop.selected.includes(e.id)&&e.status!=='cancelled').sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));}
function confirmedIncoming(id,date){return incomingStock(id,{byDate:date});}
function shoppingShortage(id,selected){
 const item=stockItem(id),selectedIds=new Set(selected.map(e=>e.id));
 const compatibleNeed=e=>lines(e).filter(i=>i.inventoryId===id&&i.unit===item.unit).reduce((n,i)=>n+i.needed,0);
 const bookings=state.events.filter(e=>e.status==='booked'&&compatibleNeed(e)>0).sort((a,b)=>a.date.localeCompare(b.date)||a.id.localeCompare(b.id));
 const remaining=e=>Math.max(0,compatibleNeed(e)-stockIssued(e,id));
 if(item.type==='reusable'){
  let peak=0;const points=new Set(bookings.filter(e=>selectedIds.has(e.id)).flatMap(e=>[e.date,e.returnDate||e.date]));
  for(const date of points){const active=bookings.filter(e=>e.date<=date&&(e.returnDate||e.date)>=date),own=active.filter(e=>selectedIds.has(e.id)).reduce((n,e)=>n+remaining(e),0),others=active.filter(e=>!selectedIds.has(e.id)).reduce((n,e)=>n+remaining(e),0);peak=Math.max(peak,own-Math.max(0,stockOnHand(id)+confirmedIncoming(id,date)-others));}
  // Other reservations can begin between selected event boundaries.
  for(const e of bookings.filter(e=>!selectedIds.has(e.id))){const date=e.date;if(!selected.some(x=>x.status==='booked'&&x.date<=date&&(x.returnDate||x.date)>=date))continue;const active=bookings.filter(x=>x.date<=date&&(x.returnDate||x.date)>=date),own=active.filter(x=>selectedIds.has(x.id)).reduce((n,x)=>n+remaining(x),0),others=active.filter(x=>!selectedIds.has(x.id)).reduce((n,x)=>n+remaining(x),0);peak=Math.max(peak,own-Math.max(0,stockOnHand(id)+confirmedIncoming(id,date)-others));}
  return Math.max(0,peak);
 }
 let available=stockOnHand(id),credited=0,buy=0;
 for(const e of bookings){const incoming=confirmedIncoming(id,e.date);available+=incoming-credited;credited=incoming;const need=remaining(e);if(selectedIds.has(e.id))buy+=Math.max(0,need-available);available=Math.max(0,available-need);}

}
function combinedShoppingRows(selected=selectedShoppingBookings(),mode=shop.mode){

 try{
  if(!cloud.pending){
   const head=await documentRecord(true);

     const data=cloudData(validState(remote.data));
     if(editingCompanyRecord()&&!initial){cloud.busy=false;renderCloudBar();return;}
     if(initial&&!lastRaw){const localExport=state.lastExport;saveCloudState({...data,lastExport:localExport});cloud.base=data;cloud.revision=Number(remote.revision);}
     else if(!cloud.base){saveCloudState({...data,lastExport:state.lastExport});cloud.base=data;cloud.revision=Number(remote.revision);}

    }else cloud.revision=Number(remote.revision);
   }
  }
  for(let tries=0;tries<3;tries++){
   if(!cloud.pending&&cloud.base&&sameValue(cloudData(state),cloud.base))break;
   if(!cloudCanWrite()){cloud.error='Read-only access: local changes cannot be uploaded.';break;}
   if(!cloud.pending){cloud.pending={operation:uid(),revision:cloud.revision,data:cloudData(state)};saveCloudMeta();}
   const pending=cloud.pending;
   const result=await rpc('catering_commit',{p_company:cloud.company.id,p_expected_revision:pending.revision,p_operation:pending.operation,p_data:pending.data});
   if(result.conflict){cloud.pending=null;saveCloudMeta();if(editingCompanyRecord())break;if(!applyMerged(cloudData(validState(result.data)),Number(result.revision)))break;continue;}
   cloud.base=pending.data;cloud.revision=Number(result.revision);cloud.pending=null;cloud.lastSync=new Date().toISOString();saveCloudMeta();
   if(cloud.migrating){localStorage.removeItem(LEGACY_KEY);localStorage.removeItem('cjCateringLastGoodV1');localStorage.setItem('cjCateringLegacyMigratedV2',cloud.company.id);cloud.migrating=false;}

 }catch(error){cloud.error=error.message;if(error.status&&error.status!==401&&error.status!==429){cloud.pending=null;cloud.blocked=true;try{saveCloudMeta();}catch{}}if(view==='account'&&!$('#editor').open)renderAccount();}

function notify(message){$('#toast').textContent=message;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4500);}
function transact(change,message='Saved on this device',allowRecovery=false,renderNow=true){
 if(typeof cloudCanWrite==='function'&&!cloudCanWrite()){notify('This account has read-only access.');return false;}
 if(readError&&!allowRecovery){notify('Restore a backup before saving, so unreadable records are preserved.');return false;}
 try{
  const current=localStorage.getItem(KEY);
  if(current!==lastRaw&&!allowRecovery){state=validState(JSON.parse(current));lastRaw=current;render();notify('Another tab saved changes. Records refreshed; please try again.');return false;}
  const next=structuredClone(state);change(next);validState(next);
  if(lastRaw&&!readError&&!recovered){try{localStorage.setItem(BACKUP_KEY,JSON.stringify(validState(JSON.parse(lastRaw))));}catch{ /* Main save may still fit when a second copy does not. */ }}
  const raw=JSON.stringify(next);localStorage.setItem(KEY,raw);state=next;lastRaw=raw;readError=false;recovered=false;if(renderNow)render();if(message)notify(message);if(typeof scheduleCloudSync==='function')scheduleCloudSync();return true;
 }catch(error){notify(error.message||'Could not save. Download a backup and check available browser storage.');return false;}
}
function dining(e){return e.counts.regular+e.counts.kids+e.counts.head;}
function multiplier(e,basis){if(basis==='table')return dining(e);if(basis==='event')return 1;if(basis==='guests')return e.counts.adults+e.counts.children;return e.counts[basis]||0;}
function lines(e){return e.items.map(i=>{const automatic=Math.round(i.rate*multiplier(e,i.basis)*1e6)/1e6;const needed=Object.hasOwn(e.overrides,i.id)?e.overrides[i.id]:automatic;const packs=needed>0?Math.ceil(needed/i.packSize-1e-10):0;return {...i,automatic,needed,packs,spare:Math.max(0,Math.round((packs*i.packSize-needed)*1e6)/1e6),cost:i.price===null?null:Math.round(packs*i.price*100)/100};}).filter(i=>i.needed>0);}
function totals(e){const rows=lines(e);return {rows,cost:rows.reduce((n,i)=>n+(i.cost||0),0),missing:rows.filter(i=>i.cost===null).length,packed:rows.filter(i=>e.packed[i.id]).length};}
function customer(id){return state.customers.find(c=>c.id===id);}
function eventById(id){return state.events.find(e=>e.id===id);}
function area(name){return state.neighborhoods.find(n=>n.name.toLowerCase()===name.toLowerCase());}
function effectiveItem(i,s=state){const v=i.inventoryId?s.inventory.find(v=>v.id===i.inventoryId):null;return v?{...structuredClone(i),unit:v.unit,packSize:v.packSize,price:v.price}:structuredClone(i);}
function snapshot(kind,neighborhood){const profile=area(neighborhood);return state.templates[kind].map(source=>{const i=effectiveItem(source);return {...i,rate:profile&&Object.hasOwn(profile.rates,i.id)?profile.rates[i.id]:i.rate};});}
function nameOf(e){return customer(e.customerId)?.name||e.contact.name;}
function shortNotes(text){return text.length>180?text.slice(0,180)+'…':text;}
function badge(e){return `<span class="badge ${e.status}">${e.status==='booked'?'Booked':e.status==='completed'?'Completed':'Cancelled'}</span>`;}
function estimate(e){const t=totals(e);return `${t.missing?'Known costs':'Supply estimate'}: ${money(t.cost)}${t.missing?` + ${t.missing} unpriced`:''}`;}
function heading(title,subtitle='',button=''){return `<div class="heading"><div><h2>${title}</h2>${subtitle?`<p class="muted no-margin">${subtitle}</p>`:''}</div>${button}</div>`;}
function action(name,label,extra='',primary=false){return `<button type="button" class="btn${primary?' primary':''}" data-action="${name}" ${extra}>${label}</button>`;}
function empty(title,text,button=''){return `<div class="empty"><div class="empty-mark" aria-hidden="true">◇</div><h3>${title}</h3><p>${text}</p>${button}</div>`;}
function card(e){const t=totals(e);return `<button class="booking-card" type="button" data-action="open-event" data-id="${e.id}"><div class="row spread"><span class="badge">${KINDS[e.kind]}</span>${badge(e)}</div><h3>${esc(nameOf(e))}</h3><p>${dateLabel(e.date)}${e.time?' · '+esc(e.time):''}<br>${esc(e.location||'Location to be confirmed')}${e.neighborhood?' · '+esc(e.neighborhood):''}</p><div class="row spread"><span>${num(dining(e))} dining tables${e.counts.coffee?' + '+num(e.counts.coffee)+' coffee':''}</span><span class="muted">${t.packed}/${t.rows.length} packed</span></div><div class="progress"><span style="width:${t.rows.length?100*t.packed/t.rows.length:0}%"></span></div><footer><span>${estimate(e)}</span><span aria-hidden="true">↗</span></footer></button>`;}

 if(typeof cloudGate==='function'&&cloudGate()){renderCloudGate();return;}
 $$('.navigation button').forEach(b=>{const on=b.dataset.view===view;b.classList.toggle('active',on);b.setAttribute('aria-current',on?'page':'false');});
 const warning=$('#recovery-notice');warning.hidden=!readError&&!recovered;
 if(!warning.hidden)warning.innerHTML=readError?'Saved records could not be read. Open Backups to download a recovery copy or restore a valid backup. New saves are paused to preserve the original data.':'Your last local backup was recovered. Download a backup now to keep a separate copy.';

 `<div class="tools-row"><input id="booking-search" type="search" aria-label="Search bookings" placeholder="Search customer, location, or neighborhood" value="${esc(search)}"><select id="booking-filter" aria-label="Filter bookings"><option value="all">All bookings</option><option value="booked">Open bookings</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div id="booking-results"></div>`;

efore making other changes.</p>${action('export-recovery','Download recovery copy')}</div>`:''}`;

t" aria-label="Booking sections">${[['supply','Supply list'],['details','Booking details'],['feedback','Feedback']].map(([k,v])=>`<button type="button" data-action="detail-tab" data-tab="${k}" class="${detailTab===k?'active':''}" aria-pressed="${detailTab===k}">${v}</button>`).join('')}</div><div id="event-content"></div>`;

function field(label,name,value='',type='text',extra=''){return `<label class="field">${label}<input type="${type}" name="${name}" value="${esc(value)}" ${extra}></label>`;}
function saveActions(label='Save'){return `<div class="error" id="form-error" role="alert"></div><div class="actions">${action('close-dialog','Cancel')}<button class="btn primary" type="submit">${label}</button></div>`;}
function formError(msg){$('#form-error').textContent=msg;}
function numberField(label,name,value=0,step='1',required=true){return field(label,name,value,'number',`min="0" max="100000000" step="${step}" ${required?'required':''}`);}
function eventDialog(id=null,duplicate=false){
 const original=id?eventById(id):null;const e=original||{customerId:'new',kind:'kiddush',date:today(),time:'',location:'',neighborhood:'',counts:{regular:12,kids:0,head:0,coffee:0,adults:0,children:0},status:'booked',quote:null,paid:0,notes:''};

)}${numberField('Kids tables','kids',e.counts.kids)}${numberField('Head tables','head',e.counts.head)}${numberField('Coffee stations','coffee',e.counts.coffee)}</div><p class="hint">Enter separate counts. Dining tables = regular + kids + head. Coffee stations are additional.</p><p class="hint" id="table-preview"></p></fieldset>${clothFields({...e,id:duplicate?null:e.id})}<fieldset class="wide"><legend>Guest counts (for per-person items)</legend><div class="counts">${numberField('Adults','adults',e.counts.adults)}${numberField('Children','children',e.counts.children)}</div></fieldset>${feeFields(e)}${numberField('Agreed charge ($, optional)','quote',e.quote??'','.01',false)}${numberField('Amount paid ($)','paid',duplicate?0:e.paid,'.01')}<label class="field wide">Special requests<textarea name="notes" maxlength="10000">${esc(e.notes)}</textarea></label>${id&&!duplicate?`<label class="check-label wide"><input type="checkbox" name="refresh">Refresh saved supplies from the current template and neighborhood</label><p class="hint wide">Otherwise the booking keeps its saved rates and prices. Changing its event type or neighborhood also refreshes the supplies. Adjustments are cleared when supplies are refreshed.</p>`:''}</div><p class="hint" id="area-preview"></p>${saveActions(duplicate?'Create duplicate':id?'Save booking':'Create booking')}</form>`);
 const form=$('#event-form');form.dataset.lastDate=duplicate?today():e.date;form.elements.customer.value=e.customerId;form.elements.kind.value=e.kind;form.elements.tableclothChoice.value=e.tableclothChoice||'unspecified';form.elements.status.value=duplicate?'booked':e.status;toggleNewCustomer();updateEventPreview();

function saveEvent(form){
 const data=new FormData(form),id=form.dataset.id,duplicate=form.dataset.duplicate==='true',old=id?eventById(id):null;
 const customerId=data.get('customer')==='new'?uid():data.get('customer');const newName=String(data.get('customerName')).trim();
 if(data.get('customer')==='new'&&!newName){formError('Enter a customer name.');return;}
 const counts=Object.fromEntries(['regular','kids','head','coffee','adults','children'].map(k=>[k,Number(data.get(k))]));
 if(!Object.values(counts).some(n=>n>0)){formError('Enter at least one table, station, or guest.');return;}
 const neighborhood=String(data.get('neighborhood')).trim(),kind=data.get('kind');
 const refreshed=!old||duplicate||data.has('refresh')||kind!==old.kind||neighborhood.toLowerCase()!==old.neighborhood.toLowerCase();
 if(String(data.get('returnDate'))<String(data.get('date'))){formError('Equipment return date must be on or after the event date.');return;}
 const contact=data.get('customer')==='new'?{name:newName,phone:String(data.get('customerPhone')).trim()}:{name:customer(customerId).name,phone:customer(customerId).phone};
 const clothChoice=String(data.get('tableclothChoice')||old?.tableclothChoice||'unspecified'),roundCount=Number(data.get('roundTables')||0);
 const now=new Date().toISOString();const event={id:old&&!duplicate?old.id:uid(),customerId,contact,kind,date:data.get('date'),time:data.get('time'),location:String(data.get('location')).trim(),neighborhood,status:data.get('status'),counts,quote:data.get('quote')===''?null:Number(data.get('quote')),paid:Number(data.get('paid')),notes:String(data.get('notes')).trim(),fees:readFees(data),returnDate:data.get('returnDate'),tableclothSources:!refreshed&&old?.tableclothSources?structuredClone(old.tableclothSources):[],items:refreshed?snapshot(kind,neighborhood):structuredClone(old.items),overrides:refreshed?{}:structuredClone(old.overrides),packed:old&&!duplicate?structuredClone(old.packed):{},feedback:old&&!duplicate?structuredClone(old.feedback):{notes:'',outcome:'',items:{}},createdAt:old&&!duplicate?old.createdAt:now,updatedAt:now,sourceLabel:refreshed?`Saved from ${KINDS[kind]} template${area(neighborhood)?' and '+neighborhood+' profile':''} on ${dateLabel(today())}`:old.sourceLabel};

 const ok=transact(s=>{applyClothChoice(s,event,clothChoice,roundCount,old&&!duplicate?old:null);if(old&&!duplicate){const before=totals(old);const after=totals(event);for(const key of Object.keys(event.packed)){const a=after.rows.find(i=>i.id===key),b=before.rows.find(i=>i.id===key);if(!a||!b||a.needed!==b.needed||a.packs!==b.packs||refreshed)delete event.packed[key];}}if(data.get('customer')==='new')s.customers.push({id:customerId,name:newName,phone:contact.phone,email:'',notes:''});if(neighborhood&&!area(neighborhood))s.neighborhoods.push({id:uid(),name:neighborhood,notes:'',rates:{}});if(old&&!duplicate)s.events[s.events.findIndex(e=>e.id===id)]=event;else s.events.push(event);},'Booking saved');
 if(ok){selected=event.id;view='bookings';detailTab='supply';closeDialog();render();window.scrollTo(0,0);}
}
function customerDialog(id=null){const c=customer(id)||{name:'',phone:'',email:'',notes:''};openDialog(id?'Edit customer':'New customer',`<form id="customer-form" data-id="${id||''}"><div class="form-grid">${field('Name','name',c.name,'text','required maxlength="200"')}${field('Phone','phone',c.phone,'tel','maxlength="100"')}${field('Email (optional)','email',c.email,'email','maxlength="200"')}<label class="field wide">Customer notes<textarea name="notes" maxlength="10000">${esc(c.notes)}</textarea></label></div>${saveActions('Save customer')}</form>`);}
function saveCustomer(form){const d=new FormData(form);const name=String(d.get('name')).trim();if(!name){formError('Enter a customer name.');return;}const c={id:form.dataset.id||uid(),name,phone:String(d.get('phone')).trim(),email:String(d.get('email')).trim(),notes:String(d.get('notes')).trim()};if(transact(s=>{const index=s.customers.findIndex(x=>x.id===c.id);if(index<0)s.customers.push(c);else s.customers[index]=c;},'Customer saved'))closeDialog();}
function itemDialog(id=null){const source=state.templates[templateKind].find(x=>x.id===id);const i=(source?effectiveItem(source):null)||{name:'',category:'Paper goods',basis:'table',rate:1,packSize:1,price:null,unit:'units'};openDialog(id?'Edit supply item':'Add supply item',`<form id="item-form" data-id="${id||''}"><div class="form-grid"><label class="field wide">Item name<input name="name" value="${esc(i.name)}" maxlength="200" required></label><label class="field">Category<select name="category">${CATEGORIES.map(v=>`<option>${v}</option>`).join('')}</select></label><label class="field">Quantity applies to each<select name="basis">${Object.entries(BASIS).map(([k,v])=>`<option value="${k}">${v}${k==='table'?' (regular + kids + head)':''}</option>`).join('')}</select></label>${numberField('Quantity per selected unit','rate',i.rate,'any')}${field('Unit description','unit',i.unit,'text','maxlength="100" required placeholder="e.g. forks, bottles, pounds"')}${field('Units in one purchase pack','packSize',i.packSize,'number','min="0.000001" max="100000000" step="any" required')}${numberField('Price per purchase pack ($)','price',i.price??'','.01',false)}</div><label class="field" style="margin-top:16px">Inventory link<select name="inventoryId"><option value="">${id?'No inventory link':'Create matching inventory item'}</option>${state.inventory.filter(v=>v.active).map(v=>`<option value="${v.id}" ${i.inventoryId===v.id?'selected':''}>${esc(v.name)} (${esc(v.unit)})</option>`).join('')}</select></label>${!id?'<label class="check-label" style="margin-top:16px"><input type="checkbox" name="addOpen" checked>Also add this new supply to existing open bookings</label>':''}<p class="hint">Leave price blank if unknown. Use 0 for a genuinely free item. Set quantity to 0 to keep an item inactive. Prices apply to whole packs.</p>${saveActions('Save item')}${id?`<div class="row" style="margin-top:16px">${action('remove-item','Remove from template',`data-id="${id}"`)}</div>`:''}</form>`);$('#item-form [name=category]').value=i.category;$('#item-form [name=basis]').value=i.basis;}
function saveItem(form){const d=new FormData(form);const name=String(d.get('name')).trim(),unit=String(d.get('unit')).trim();if(!name||!unit){formError('Enter an item name and unit description.');return;}const i={id:form.dataset.id||uid(),name,category:d.get('category'),basis:d.get('basis'),rate:Number(d.get('rate')),packSize:Number(d.get('packSize')),price:d.get('price')===''?null:Number(d.get('price')),unit,inventoryId:d.get('inventoryId')||null};if(transact(s=>{const rows=s.templates[templateKind],index=rows.findIndex(x=>x.id===i.id);if(!i.inventoryId&&index<0)createStockFor(s,i);if(i.inventoryId){const stock=s.inventory.find(v=>v.id===i.inventoryId);i.unit=stock.unit;stock.price=i.price;stock.packSize=i.packSize;}if(index<0){rows.push(i);if(d.has('addOpen'))s.events.filter(e=>e.kind===templateKind&&e.status==='booked').forEach(e=>{const n=s.neighborhoods.find(n=>n.name.toLowerCase()===e.neighborhood.toLowerCase());e.items.push({...structuredClone(i),rate:n&&Object.hasOwn(n.rates,i.id)?n.rates[i.id]:i.rate});e.updatedAt=new Date().toISOString();});}else rows[index]=i;},'Template saved. New items were added to selected open bookings; existing supplies were kept.'))closeDialog();}
function allItems(){return Object.entries(state.templates).flatMap(([kind,rows])=>rows.map(i=>({...i,kind})));}
function adjustmentRow(id='',rate=''){const rows=allItems();return `<div class="adjustment"><label class="field">Supply item<select data-area-item required><option value="">Choose an item</option>${rows.map(i=>`<option value="${i.id}" ${i.id===id?'selected':''}>${KINDS[i.kind]}: ${esc(i.name)} / ${BASIS[i.basis].toLowerCase()}</option>`).join('')}</select></label><label class="field">Quantity<input data-area-rate type="number" min="0" max="100000000" step="any" value="${rate}" required></label><button type="button" class="close" data-action="remove-adjustment" aria-label="Remove adjustment">×</button></div>`;}
function areaDialog(id=null){const n=state.neighborhoods.find(x=>x.id===id)||{name:'',notes:'',rates:{}};openDialog(id?'Edit neighborhood':'New neighborhood',`<form id="area-form" data-id="${id||''}"><div class="form-grid"><label class="field wide">Neighborhood name<input name="name" value="${esc(n.name)}" maxlength="200" required></label><label class="field wide">Preferences and planning notes<textarea name="notes" maxlength="10000" placeholder="What should you remember for events here?">${esc(n.notes)}</textarea></label></div><h3 style="margin:24px 0 5px">Supply adjustments</h3><p class="hint">Replace an item’s standard rate, using the same unit shown in its rule. For example, set soda to 2 per dining table. Set 0 to omit an item.</p><div id="adjustment-rows">${Object.entries(n.rates).filter(([key])=>allItems().some(i=>i.id===key)).map(([key,value])=>adjustmentRow(key,value)).join('')}</div>${action('add-adjustment','+ Add adjustment')}${saveActions('Save neighborhood')}</form>`);}
function saveArea(form){const d=new FormData(form);const name=String(d.get('name')).trim();if(!name){formError('Enter a neighborhood name.');return;}const duplicate=state.neighborhoods.find(n=>n.name.toLowerCase()===name.toLowerCase()&&n.id!==form.dataset.id);if(duplicate){formError('A neighborhood with this name already exists.');return;}const rates={};for(const row of form.querySelectorAll('.adjustment')){const key=row.querySelector('[data-area-item]').value;if(Object.hasOwn(rates,key)){formError('Choose each supply item only once.');return;}rates[key]=Number(row.querySelector('[data-area-rate]').value);}const n={id:form.dataset.id||uid(),name,notes:String(d.get('notes')).trim(),rates};if(transact(s=>{const index=s.neighborhoods.findIndex(x=>x.id===n.id);if(index<0)s.neighborhoods.push(n);else{const oldName=s.neighborhoods[index].name;s.neighborhoods[index]=n;s.events.forEach(e=>{if(e.neighborhood.toLowerCase()===oldName.toLowerCase())e.neighborhood=name;});}},'Neighborhood saved. Existing supply lists keep their saved rates.'))closeDialog();}
function adjustDialog(id){const e=eventById(selected),i=e.items.find(x=>x.id===id);openDialog('Adjust this booking',`<form id="override-form" data-id="${id}"><h3>${esc(i.name)}</h3><p class="muted">Automatic quantity: ${num(i.rate*multiplier(e,i.basis))} ${esc(i.unit)}. This change affects this booking only.</p><div class="form-grid">${numberField('Total quantity needed','needed',Object.hasOwn(e.overrides,id)?e.overrides[id]:i.rate*multiplier(e,i.basis),'any')}${numberField('Price per purchase pack ($)','price',i.price??'','.01',false)}</div><p class="hint">The price is saved with this booking. Purchase packs still round up automatically.</p>${saveActions('Save adjustment')}<div style="margin-top:16px">${action('reset-override','Use automatic quantity',`data-id="${id}"`)}</div></form>`);}
function saveOverride(form){const d=new FormData(form),id=form.dataset.id;if(transact(s=>{const e=s.events.find(e=>e.id===selected);e.overrides[id]=Number(d.get('needed'));e.items.find(i=>i.id===id).price=d.get('price')===''?null:Number(d.get('price'));delete e.packed[id];e.updatedAt=new Date().toISOString();},'Booking adjustment saved'))closeDialog();}
function saveFeedback(form){const d=new FormData(form);const items={};form.querySelectorAll('[data-short]').forEach(input=>{const id=input.dataset.short;const left=form.querySelector(`[data-left="${id}"]`);const shortValue=Number(input.value),leftValue=Number(left.value);if(shortValue||leftValue)items[id]={short:shortValue,left:leftValue};});if(transact(s=>{const e=s.events.find(e=>e.id===selected);e.feedback={notes:String(d.get('notes')).trim(),outcome:d.get('outcome'),items};if(d.has('complete'))e.status='completed';else if(e.status==='completed')e.status='booked';e.updatedAt=new Date().toISOString();},'Feedback saved'))feedbackDirty=false;}
function download(filename,contents,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([contents],{type}));a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function exportBackup(){if(readError){notify('Download the recovery copy or restore a valid backup first.');return;}const when=new Date().toISOString();const copy=structuredClone(state);copy.lastExport=when;download(`catering-backup-${today()}-${when.slice(11,19).replaceAll(':','')}.json`,JSON.stringify({app:'cj-catering',version:1,company:cloud.company?{id:cloud.company.id,name:cloud.company.name}:null,exportedAt:when,data:copy},null,2),'application/json');transact(s=>s.lastExport=when,'Backup downloaded');}
function exportCsv(){const e=eventById(selected),t=totals(e);const rows=[['Customer',nameOf(e)],['Event',KINDS[e.kind]],['Date',e.date],['Location',e.location],['Neighborhood',e.neighborhood],['Dining tables',dining(e)],['Tablecloth choice',CLOTH_CHOICES[e.tableclothChoice||'unspecified']],[],['Item','Unit','Needed','Units per purchase pack','Packs to buy','Extra units','Price per pack','Estimated cost','Packed'],...t.rows.map(i=>[i.name,i.unit,i.needed,i.packSize,i.packs,i.spare,i.price===null?'Unknown':i.price,i.cost===null?'Unknown':i.cost,e.packed[i.id]?'Yes':'No']),[],[t.missing?'Known costs (incomplete)':'Supply estimate',t.cost],['Unpriced items',t.missing],['Service fee',e.fees.service],['Waiter fee',feeTotals(e).waiters],['Calculated total (before unpriced items)',feeTotals(e).total]];const csv=rows.map(row=>row.map(v=>{let text=String(v??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replaceAll('"','""')+'"';}).join(',')).join('\r\n');download(`catering-supplies-${e.date}.csv`,'\ufeff'+csv,'text/csv;charset=utf-8');}
let pendingImport=null;
async function readBackup(file){if(!file)return;if(file.size>10*1024*1024){notify('Choose a backup smaller than 10 MB.');return;}try{const envelope=JSON.parse(await file.text());if(envelope.app!=='cj-catering'||envelope.version!==1)throw Error('Choose a Simcha King or Catering Planner JSON backup.');if(cloud.company&&envelope.company&&envelope.company.id!==cloud.company.id)throw Error('This backup belongs to another company. Switch to that company first.');pendingImport=validState(envelope.data);openDialog('Review backup before restoring',`<p>This backup contains:</p><div class="stats"><div class="stat"><strong>${pendingImport.events.length}</strong><span>Bookings</span></div><div class="stat"><strong>${pendingImport.customers.length}</strong><span>Customers</span></div><div class="stat"><strong>${pendingImport.neighborhoods.length}</strong><span>Neighborhoods</span></div></div><div class="notice">${cloud.company?'Import adds missing records into this company and preserves existing shared records and stock history.':'Restoring replaces this browser’s Simcha King records and templates.'} A copy of your current readable records will be downloaded first. Other portal tools are unaffected.</div><div class="actions">${action('close-dialog','Cancel')}${action('confirm-import','Replace records with this backup','',true)}</div>`);}catch(error){pendingImport=null;notify(error.message||'This backup could not be read.');}}
function restoreBackup(){if(!pendingImport)return;const replacement=cloud.company?mergeImport(state,pendingImport):structuredClone(pendingImport);if(!readError)download(`catering-before-restore-${today()}.json`,JSON.stringify({app:'cj-catering',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json');if(transact(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,replacement);},'Backup restored',true)){pendingImport=null;selected=null;search='';closeDialog();render();}}
function confirmDelete(title,text,kind,id){openDialog(title,`<p class="muted">${text}</p><div class="actions">${action('close-dialog','Keep it')}<button type="button" class="btn danger" data-action="confirm-delete" data-kind="${kind}" data-id="${id}">Delete</button></div>`);}
document.addEventListener('click',async event=>{
 const nav=event.target.closest('[data-view]');if(nav){if(feedbackDirty&&!confirm('Leave feedback without saving your edits?'))return;feedbackDirty=false;view=nav.dataset.view;selected=null;if(view==='purchases')selectedPurchase=null;search='';render();window.scrollTo(0,0);return;}

 case 'adjust-item':adjustDialog(id);break;
 case 'reset-override':if(transact(s=>{const e=s.events.find(e=>e.id===selected);delete e.overrides[id];delete e.packed[id];e.updatedAt=new Date().toISOString();},'Automatic quantity restored'))closeDialog();break;
 case 'complete-event':transact(s=>{const e=s.events.find(e=>e.id===id);e.status=e.status==='completed'?'booked':'completed';e.updatedAt=new Date().toISOString();},'Booking status saved');break;
 case 'delete-event':confirmDelete('Delete this booking?','Its saved supply list, packing progress, and feedback will also be deleted. Its customer record will remain.','event',id);break;
 case 'confirm-delete':{const ok=transact(s=>{if(b.dataset.kind==='event'){s.events=s.events.filter(e=>e.id!==id);}else{s.templates[templateKind]=s.templates[templateKind].filter(i=>i.id!==id);s.neighborhoods.forEach(n=>delete n.rates[id]);}},'Deleted');if(ok){closeDialog();render();}break;}
 case 'export-backup':exportBackup();break;

 case 'confirm-import':restoreBackup();break;
 case 'export-csv':exportCsv();break;
 case 'export-recovery':download(`catering-recovery-${today()}.txt`,lastRaw||'No original saved bytes','text/plain');break;
 case 'install-app':if(deferredInstall){await deferredInstall.prompt();deferredInstall=null;b.hidden=true;}break;
 }
 if($('#editor').open&&['open-event','open-feedback'].includes(b.dataset.action))closeDialog();
});
document.addEventListener('input',event=>{operationsInput(event.target);if(event.target.id==='booking-search'){search=event.target.value;paintBookingResults();}if(event.target.id==='customer-search')paintCustomers(event.target.value);if(event.target.id==='feedback-search'){search=event.target.value;paintHistory();}if(event.target.closest('#event-form')){const f=$('#event-form');if(event.target.name==='date'){if(f.elements.returnDate.value===f.dataset.lastDate||f.elements.returnDate.value<f.elements.date.value)f.elements.returnDate.value=f.elements.date.value;f.dataset.lastDate=f.elements.date.value;}updateEventPreview();}if(event.target.closest('#feedback-form'))feedbackDirty=true;});
document.addEventListener('change',event=>{shoppingChange(event.target);operationsChange(event.target);if(event.target.id==='event-customer')toggleNewCustomer();if(event.target.id==='booking-filter'){filter=event.target.value;paintBookingResults();}if(event.target.matches('[data-pack]')){const itemId=event.target.dataset.pack,checked=event.target.checked;transact(s=>{const e=s.events.find(e=>e.id===selected);e.packed[itemId]=checked;e.updatedAt=new Date().toISOString();},checked?'Marked packed':'Marked unpacked');}if(event.target.id==='backup-file'){readBackup(event.target.files[0]);event.target.value='';}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;if(form.id==='shopping-filter-form'){applyShoppingFilters(form);return;}if(operationsSubmit(form)||(typeof cloudSubmit==='function'&&cloudSubmit(form)))return;({ 'event-form':saveEvent,'customer-form':saveCustomer,'item-form':saveItem,'area-form':saveArea,'override-form':saveOverride,'feedback-form':saveFeedback }[form.id]||(()=>{}))(form);});
let feedbackDirty=false,deferredInstall=null,offlineReady=false;
window.addEventListener('beforeunload',event=>{if(feedbackDirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event;if($('#install-button'))$('#install-button').hidden=false;});
function connection(){const offline=!navigator.onLine;$('#connection-dot').classList.toggle('offline',offline);$('#connection-status').textContent=offline?(offlineReady?'Working offline':'Offline'):(offlineReady?'Ready offline':'Online');}
window.addEventListener('online',connection);window.addEventListener('offline',connection);
window.addEventListener('storage',event=>{if(event.key===shoppingKey()){shoppingScope=null;if(view==='shopping'&&!editingCompanyRecord())renderShopping();return;}if(event.key!==KEY||!event.newValue)return;try{state=validState(JSON.parse(event.newValue));lastRaw=event.newValue;if(!$('#editor').open&&!$('#feedback-form'))render();notify('Records updated from another tab.');}catch{notify('Another tab wrote an unreadable record. Download a backup.');}});
render();connection();if(typeof initializeCloud==='function')initializeCloud();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/catering/sw.js',{scope:'/catering/'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;connection();}).catch(()=>{offlineReady=false;connection();$('#connection-status').textContent=navigator.onLine?'Online only':'Offline';});}
