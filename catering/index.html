function validState(s){

 const obj=v=>v&&typeof v==='object'&&!Array.isArray(v);

 assert(obj(s)&&s.version===1,'This is not a supported Catering Planner backup.');
 assert(obj(s.templates));items(s.templates.bris);items(s.templates.kiddush);

 const customerIds=new Set();s.customers.forEach(c=>{assert(obj(c)&&id(c.id)&&!customerIds.has(c.id)&&str(c.name,200)&&c.name.trim()&&str(c.phone,100)&&str(c.email,200)&&str(c.notes));customerIds.add(c.id);});
 const areaNames=new Set();s.neighborhoods.forEach(n=>{assert(obj(n)&&id(n.id)&&str(n.name,200)&&n.name.trim()&&!areaNames.has(n.name.toLowerCase())&&str(n.notes)&&obj(n.rates));areaNames.add(n.name.toLowerCase());Object.entries(n.rates).forEach(([k,v])=>assert(id(k)&&quantity(v)));});

  $('#feedback-form [name=outcome]').value=e.feedback.outcome;
 }

function saveEvent(form){
 const data=new FormData(form),id=form.dataset.id,duplicate=form.dataset.duplicate==='true',old=id?eventById(id):null;

 const counts=Object.fromEntries(['regular','kids','head','coffee','adults','children'].map(k=>[k,Number(data.get(k))]));
 if(!Object.values(counts).some(n=>n>0)){formError('Enter at least one table, station, or guest.');return;}
 const neighborhood=String(data.get('neighborhood')).trim(),kind=data.get('kind');
 const refreshed=!old||duplicate||data.has('refresh')||kind!==old.kind||neighborhood.toLowerCase()!==old.neighborhood.toLowerCase();
 const contact=data.get('customer')==='new'?{name:newName,phone:String(data.get('customerPhone')).trim()}:{name:customer(customerId).name,phone:customer(customerId).phone};
 const now=new Date().toISOString();const event={id:old&&!duplicate?old.id:uid(),customerId,contact,kind,date:data.get('date'),time:data.get('time'),location:String(data.get('location')).trim(),neighborhood,status:data.get('status'),counts,quote:data.get('quote')===''?null:Number(data.get('quote')),paid:Number(data.get('paid')),notes:String(data.get('notes')).trim(),items:refreshed?snapshot(kind,neighborhood):structuredClone(old.items),overrides:refreshed?{}:structuredClone(old.overrides),packed:old&&!duplicate?structuredClone(old.packed):{},feedback:old&&!duplicate?structuredClone(old.feedback):{notes:'',outcome:'',items:{}},createdAt:old&&!duplicate?old.createdAt:now,updatedAt:now,sourceLabel:refreshed?`Saved from ${KINDS[kind]} template${area(neighborhood)?' and '+neighborhood+' profile':''} on ${dateLabel(today())}`:old.sourceLabel};
 if(old&&!duplicate){const before=totals(old);const after=totals(event);for(const key of Object.keys(event.packed)){const a=after.rows.find(i=>i.id===key),b=before.rows.find(i=>i.id===key);if(!a||!b||a.needed!==b.needed||a.packs!==b.packs||refreshed)delete event.packed[key];}}
 const ok=transact(s=>{if(data.get('customer')==='new')s.customers.push({id:customerId,name:newName,phone:contact.phone,email:'',notes:''});if(neighborhood&&!area(neighborhood))s.neighborhoods.push({id:uid(),name:neighborhood,notes:'',rates:{}});if(old&&!duplicate)s.events[s.events.findIndex(e=>e.id===id)]=event;else s.events.push(event);},'Booking saved');
 if(ok){selected=event.id;view='bookings';detailTab='supply';closeDialog();render();window.scrollTo(0,0);}
}
function customerDialog(id=null){const c=customer(id)||{name:'',phone:'',email:'',notes:''};openDialog(id?'Edit customer':'New customer',`<form id="customer-form" data-id="${id||''}"><div class="form-grid">${field('Name','name',c.name,'text','required maxlength="200"')}${field('Phone','phone',c.phone,'tel','maxlength="100"')}${field('Email (optional)','email',c.email,'email','maxlength="200"')}<label class="field wide">Customer notes<textarea name="notes" maxlength="10000">${esc(c.notes)}</textarea></label></div>${saveActions('Save customer')}</form>`);}

function itemDialog(id=null){const i=state.templates[templateKind].find(x=>x.id===id)||{name:'',category:'Paper goods',basis:'table',rate:1,packSize:1,price:null,unit:'units'};openDialog(id?'Edit supply item':'Add supply item',`<form id="item-form" data-id="${id||''}"><div class="form-grid"><label class="field wide">Item name<input name="name" value="${esc(i.name)}" maxlength="200" required></label><label class="field">Category<select name="category">${CATEGORIES.map(v=>`<option>${v}</option>`).join('')}</select></label><label class="field">Quantity applies to each<select name="basis">${Object.entries(BASIS).map(([k,v])=>`<option value="${k}">${v}${k==='table'?' (regular + kids + head)':''}</option>`).join('')}</select></label>${numberField('Quantity per selected unit','rate',i.rate,'any')}${field('Unit description','unit',i.unit,'text','maxlength="100" required placeholder="e.g. forks, bottles, pounds"')}${field('Units in one purchase pack','packSize',i.packSize,'number','min="0.000001" max="100000000" step="any" required')}${numberField('Price per purchase pack ($)','price',i.price??'','.01',false)}</div><p class="hint">Leave price blank if unknown. Use 0 for a genuinely free item. Set quantity to 0 to keep an item inactive. Prices apply to whole packs.</p>${saveActions('Save item')}${id?`<div class="row" style="margin-top:16px">${action('remove-item','Remove from template',`data-id="${id}"`)}</div>`:''}</form>`);$('#item-form [name=category]').value=i.category;$('#item-form [name=basis]').value=i.basis;}

function saveArea(form){const d=new FormData(form);const name=String(d.get('name')).trim();if(!name){formError('Enter a neighborhood name.');return;}const duplicate=state.neighborhoods.find(n=>n.name.toLowerCase()===name.toLowerCase()&&n.id!==form.dataset.id);if(duplicate){formError('A neighborhood with this name already exists.');return;}const rates={};for(const row of form.querySelectorAll('.adjustment')){const key=row.querySelector('[data-area-item]').value;if(Object.hasOwn(rates,key)){formError('Choose each supply item only once.');return;}rates[key]=Number(row.querySelector('[data-area-rate]').value);}const n={id:form.dataset.id||uid(),name,notes:String(d.get('notes')).trim(),rates};if(transact(s=>{const index=s.neighborhoods.findIndex(x=>x.id===n.id);if(index<0)s.neighborhoods.push(n);else{const oldName=s.neighborhoods[index].name;s.neighborhoods[index]=n;s.events.forEach(e=>{if(e.neighborhood.toLowerCase()===oldName.toLowerCase())e.neighborhood=name;});}},'Neighborhood saved. Existing supply lists keep their saved rates.'))closeDialog();}

let pendingImport=null;
async function readBackup(file){if(!file)return;if(file.size>10*1024*1024){notify('Choose a backup smaller than 10 MB.');return;}try{const envelope=JSON.parse(await file.text());if(envelope.app!=='cj-catering'||envelope.version!==1)throw Error('Choose a Catering Planner JSON backup.');pendingImport=validState(envelope.data);openDialog('Review backup before restoring',`<p>This backup contains:</p><div class="stats"><div class="stat"><strong>${pendingImport.events.length}</strong><span>Bookings</span></div><div class="stat"><strong>${pendingImport.customers.length}</strong><span>Customers</span></div><div class="stat"><strong>${pendingImport.neighborhoods.length}</strong><span>Neighborhoods</span></div></div><div class="notice">Restoring replaces this browser’s Catering Planner records and templates. A copy of your current readable records will be downloaded first. Other portal tools are unaffected.</div><div class="actions">${action('close-dialog','Cancel')}${action('confirm-import','Replace records with this backup','',true)}</div>`);}catch(error){pendingImport=null;notify(error.message||'This backup could not be read.');}}
function restoreBackup(){if(!pendingImport)return;const replacement=structuredClone(pendingImport);if(!readError)download(`catering-before-restore-${today()}.json`,JSON.stringify({app:'cj-catering',version:1,exportedAt:new Date().toISOString(),data:state},null,2),'application/json');if(transact(s=>{Object.keys(s).forEach(k=>delete s[k]);Object.assign(s,replacement);},'Backup restored',true)){pendingImport=null;selected=null;search='';closeDialog();render();}}

 const nav=event.target.closest('[data-view]');if(nav){if(feedbackDirty&&!confirm('Leave feedback without saving your edits?'))return;feedbackDirty=false;view=nav.dataset.view;selected=null;search='';render();window.scrollTo(0,0);return;}

 case 'complete-event':transact(s=>{const e=s.events.find(e=>e.id===id);e.status=e.status==='completed'?'booked':'completed';e.updatedAt=new Date().toISOString();},'Booking status saved');break;
 case 'delete-event':confirmDelete('Delete this booking?','Its saved supply list, packing progress, and feedback will also be deleted. Its customer record will remain.','event',id);break;
 case 'confirm-delete':{const ok=transact(s=>{if(b.dataset.kind==='event'){s.events=s.events.filter(e=>e.id!==id);}else{s.templates[templateKind]=s.templates[templateKind].filter(i=>i.id!==id);s.neighborhoods.forEach(n=>delete n.rates[id]);}},'Deleted');if(ok){closeDialog();render();}break;}
 case 'export-backup':exportBackup();break;

 }
 if($('#editor').open&&['open-event','open-feedback'].includes(b.dataset.action))closeDialog();
});
document.addEventListener('input',event=>{if(event.target.id==='booking-search'){search=event.target.value;paintBookingResults();}if(event.target.id==='customer-search')paintCustomers(event.target.value);if(event.target.id==='feedback-search'){search=event.target.value;paintHistory();}if(event.target.closest('#event-form'))updateEventPreview();if(event.target.closest('#feedback-form'))feedbackDirty=true;});
document.addEventListener('change',event=>{if(event.target.id==='event-customer')toggleNewCustomer();if(event.target.id==='booking-filter'){filter=event.target.value;paintBookingResults();}if(event.target.matches('[data-pack]')){const itemId=event.target.dataset.pack,checked=event.target.checked;transact(s=>{const e=s.events.find(e=>e.id===selected);e.packed[itemId]=checked;e.updatedAt=new Date().toISOString();},checked?'Marked packed':'Marked unpacked');}if(event.target.id==='backup-file'){readBackup(event.target.files[0]);event.target.value='';}});
document.addEventListener('submit',event=>{event.preventDefault();const form=event.target;({ 'event-form':saveEvent,'customer-form':saveCustomer,'item-form':saveItem,'area-form':saveArea,'override-form':saveOverride,'feedback-form':saveFeedback }[form.id]||(()=>{}))(form);});
let feedbackDirty=false,deferredInstall=null,offlineReady=false;
window.addEventListener('beforeunload',event=>{if(feedbackDirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstall=event;if($('#install-button'))$('#install-button').hidden=false;});
function connection(){const offline=!navigator.onLine;$('#connection-dot').classList.toggle('offline',offline);$('#connection-status').textContent=offline?(offlineReady?'Working offline':'Offline'):(offlineReady?'Ready offline':'Online');}
window.addEventListener('online',connection);window.addEventListener('offline',connection);
window.addEventListener('storage',event=>{if(event.key!==KEY||!event.newValue)return;try{state=validState(JSON.parse(event.newValue));lastRaw=event.newValue;if(!$('#editor').open&&!$('#feedback-form'))render();notify('Records updated from another tab.');}catch{notify('Another tab wrote an unreadable record. Download a backup.');}});
render();connection();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/catering/sw.js',{scope:'/catering/'}).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;connection();}).catch(()=>{offlineReady=false;connection();$('#connection-status').textContent=navigator.onLine?'Online only':'Offline';});}
</script>
