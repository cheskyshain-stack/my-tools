<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="description" content="The Yeshiva K'tana school calendar for 2026-2027, laid out month by month with every dismissal, vacation and event. Part of CJ Portal.">

<link rel="manifest" href="/school/manifest.json">
<link rel="apple-touch-icon" href="/school/icon.png">

<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;overscroll-behavior-y:none}
  body{
    background:var(--cj-bg,#050A18);
    color:var(--cj-text,#EDF2FF);
    font-family:var(--cj-body,"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif);
    line-height:1.45;
    padding:10px 12px calc(34px + env(safe-area-inset-bottom));
    max-width:1100px;margin:0 auto;
  }
  body .cj-page-header{width:100%;max-width:none;padding-left:0;padding-right:0}
  h2{font-family:var(--cj-display,Georgia,serif);font-weight:600;font-size:1.05rem;margin:0 0 10px;letter-spacing:-.2px}
  p.hint{margin:0;color:var(--cj-muted,#93A3C7);font-size:12.5px}

  .card{
    background:var(--cj-card,#121D38);border:1px solid var(--cj-line,rgba(255,255,255,.08));
    border-radius:var(--cj-r-lg,20px);box-shadow:var(--cj-shadow,0 18px 44px rgba(0,0,0,.45));
    padding:14px;margin-bottom:13px;
  }

  /* ===== The bar above the grid ===== */
  .bar{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .bar .spacer{flex:1 1 auto}
  .nav-btn{
    width:40px;height:40px;flex:none;border-radius:12px;cursor:pointer;
    border:1px solid var(--cj-line,rgba(255,255,255,.09));background:rgba(255,255,255,.05);
    color:var(--cj-text,#EDF2FF);font:700 17px/1 inherit;
  }
  .nav-btn:disabled{opacity:.3}
  .month-name{
    font-family:var(--cj-display,Georgia,serif);font-size:1.22rem;font-weight:600;
    letter-spacing:-.2px;min-width:170px;text-align:center;
  }
  .month-name span{color:var(--cj-muted,#93A3C7);font-size:.85em;margin-left:5px}
  .pill{
    height:38px;padding:0 14px;border-radius:999px;cursor:pointer;flex:none;
    border:1px solid var(--cj-line,rgba(255,255,255,.09));background:rgba(255,255,255,.05);
    color:var(--cj-muted,#93A3C7);font:700 12.5px/1 inherit;
  }
  .pill.on{background:linear-gradient(140deg,#2583F7,#1763CF);border-color:transparent;color:#fff}
  select.pill{appearance:none;padding-right:30px;
    background-image:linear-gradient(45deg,transparent 50%,#93A3C7 50%),linear-gradient(135deg,#93A3C7 50%,transparent 50%);
    background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat}

  /* ===== The month grid ===== */
  .dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
  .dow div{
    text-align:center;font-size:10.5px;font-weight:800;letter-spacing:.1em;
    color:var(--cj-dim,#67779C);text-transform:uppercase;padding:2px 0;
  }
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;overscroll-behavior:contain}
  .day{
    position:relative;min-height:62px;border-radius:12px;padding:5px 6px 6px;
    border:1px solid var(--cj-line,rgba(255,255,255,.07));background:rgba(255,255,255,.022);
    display:flex;flex-direction:column;gap:3px;overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .day.blank{background:transparent;border-color:transparent}
  .day.gone{opacity:.34}
  .day.has{cursor:pointer;background:rgba(255,255,255,.05)}
  .day.hasheb{cursor:pointer}
  .day.sat{background:rgba(37,131,247,.06)}
  .day.today{outline:2px solid #2583F7;outline-offset:-2px}
  .dnum{font-family:var(--cj-mono,ui-monospace,Menlo,monospace);font-size:13px;font-weight:600;line-height:1}
  .day.out .dnum{color:var(--cj-dim,#3d4a63)}
  .dheb{font-size:9.5px;color:var(--cj-dim,#67779C);line-height:1.1}
  /* The parsha, or the Yom Tov. Tiny on purpose, and never the reason a cell
     grows: it wraps to two lines and stops. */
  .dheb2{
    font-size:9px;line-height:1.15;color:#8ea3c9;letter-spacing:.01em;text-align:center;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  }
  .dheb2.yt{color:#f0c46a}
  .sheet-heb{font-size:14px;color:#cfe0ff;margin:0 0 10px;padding:9px 11px;border-radius:12px;
    background:rgba(37,131,247,.10);border:1px solid rgba(37,131,247,.22)}
  .sheet-heb b{font-weight:700}
  .dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .dtext{font-size:10px;line-height:1.25;color:var(--cj-muted,#93A3C7);
    display:none;overflow:hidden;-webkit-line-clamp:3;-webkit-box-orient:vertical}

  /* A band across the days a multi day event covers. */
  .day.span::after{content:"";position:absolute;left:0;right:0;top:0;height:3px}

  .c-off{background:#f4707d}    .b-off{background:rgba(244,112,125,.20)}
  .c-begins{background:#34d399} .b-begins{background:rgba(52,211,153,.20)}
  .c-dismissal{background:#4c9bf5} .b-dismissal{background:rgba(76,155,245,.20)}
  .c-fds{background:#f5b301}    .b-fds{background:rgba(245,179,1,.20)}
  .c-event{background:#a78bfa}  .b-event{background:rgba(167,139,250,.20)}

  @media(max-width:559px){
    .dheb{display:none}
    .dheb2{font-size:8px;-webkit-line-clamp:2}
    .day{min-height:54px}
    .dots{justify-content:flex-start}
  }
  @media(min-width:760px){
    .day{min-height:104px}
    .dtext{display:-webkit-box}
    .dots{margin-top:2px}
  }

  /* ===== The month's events, written out ===== */
  .ev{display:flex;gap:11px;padding:10px 0;border-top:1px solid var(--cj-line-soft,rgba(255,255,255,.05))}
  .ev:first-child{border-top:0}
  .ev-when{flex:0 0 82px;min-width:0}
  .ev-date{font-family:var(--cj-mono,ui-monospace,Menlo,monospace);font-size:12.5px;font-weight:600}
  .ev-day{font-size:10.5px;color:var(--cj-dim,#67779C);margin-top:1px}
  .ev-heb{font-size:11px;color:var(--cj-muted,#93A3C7);margin-top:2px}
  .ev-what{flex:1 1 auto;min-width:0;font-size:13.5px;white-space:pre-line;word-break:break-word}
  .ev-tag{
    display:inline-block;margin-top:5px;padding:2px 9px;border-radius:999px;
    font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;
  }
  .t-off{background:rgba(244,112,125,.16);color:#f9a8b1}
  .t-begins{background:rgba(52,211,153,.16);color:#6ee7b7}
  .t-dismissal{background:rgba(76,155,245,.16);color:#9dc6ff}
  .t-fds{background:rgba(245,179,1,.16);color:#f7d08a}
  .t-event{background:rgba(167,139,250,.16);color:#c9b8fd}

  .legend{display:flex;gap:13px;flex-wrap:wrap;margin-top:2px}
  .legend span{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--cj-muted,#93A3C7)}

  .notes li{font-size:13px;margin-bottom:7px;white-space:pre-line}
  .notes ul{margin:0;padding-left:19px}

  .empty{padding:20px 6px;text-align:center;color:var(--cj-muted,#93A3C7);font-size:13px}

  /* A month arrives from the side it came from, so a swipe reads as movement
     rather than a redraw. No touch-action is set anywhere: scrolling up and
     down stays entirely the browser's, and a sideways flick is only ever
     recognised after the fact. */
  @keyframes fromRight{from{opacity:.4;transform:translateX(7%)}to{opacity:1;transform:none}}
  @keyframes fromLeft{from{opacity:.4;transform:translateX(-7%)}to{opacity:1;transform:none}}
  #view.in-next{animation:fromRight .22s cubic-bezier(.22,.9,.28,1)}
  #view.in-prev{animation:fromLeft .22s cubic-bezier(.22,.9,.28,1)}
  @media(prefers-reduced-motion:reduce){ #view.in-next,#view.in-prev{animation:none} }

  /* ===== The day sheet ===== */
  #sheet{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;justify-content:center;
    background:rgba(4,7,14,.72);padding:14px}
  #sheet.open{display:flex}
  .sheet-box{width:100%;max-width:520px;max-height:86vh;overflow:auto;
    background:linear-gradient(180deg,#16233f,#101a31);border:1px solid var(--cj-line,rgba(255,255,255,.09));
    border-radius:20px;padding:16px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
  .sheet-close{width:34px;height:34px;flex:none;border-radius:10px;cursor:pointer;
    border:1px solid var(--cj-line,rgba(255,255,255,.09));background:rgba(255,255,255,.05);color:#93A3C7;font:700 15px/1 inherit}
  @media(min-width:620px){ #sheet{align-items:center} }

  /* ===== Print: one month a page ===== */
  @media print{
    body{background:#fff;color:#000;max-width:none;padding:0}
    .cj-page-header,.bar,#sheet,.no-print{display:none!important}
    .card{background:#fff;border:1px solid #999;box-shadow:none;break-inside:avoid;margin:0 0 10px}
    .month-page{break-after:page}
    .month-page:last-child{break-after:auto}
    .day{border-color:#bbb;background:#fff!important;min-height:86px}
    .dtext{display:-webkit-box;color:#333}
    .dnum,.ev-what,.ev-date{color:#000}
    .dheb,.ev-day,.ev-heb,.legend span{color:#444}
  }
</style>

<body>

<header class="cj-page-header">
  <a class="cj-brand" href="/" aria-label="CJ Portal home"><img src="/school/icon.png" alt="School Calendar"></a>
  <h1>School Calendar</h1>
</header>

<div class="bar no-print">
  <button class="nav-btn" id="prev" type="button" aria-label="Previous month">‹</button>
  <div class="month-name" id="monthName"></div>
  <button class="nav-btn" id="next" type="button" aria-label="Next month">›</button>
  <div class="spacer"></div>
  <select class="pill" id="jump" aria-label="Jump to a month"></select>
  <button class="pill" id="todayBtn" type="button">Today</button>
  <button class="pill" id="allBtn" type="button">Whole year</button>
  <button class="pill" id="pastBtn" type="button" style="display:none">Include past</button>
</div>

<div id="view"></div>

<div class="card no-print">
  <h2>What the colours mean</h2>
  <div class="legend">
    <span><i class="dot c-off"></i>No school</span>
    <span><i class="dot c-begins"></i>Starts or resumes</span>
    <span><i class="dot c-dismissal"></i>Dismissal change</span>
    <span><i class="dot c-fds"></i>Friday schedule</span>
    <span><i class="dot c-event"></i>School event</span>
  </div>
</div>

<div class="card notes">
  <h2>Notes</h2>
  <ul id="notes"></ul>
</div>

<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-box">
    <div class="sheet-head">
      <h2 id="sheetTitle" style="margin:0"></h2>
      <button class="sheet-close" id="sheetClose" type="button" aria-label="Close">✕</button>
    </div>
    <p class="hint" id="sheetSub" style="margin-bottom:12px"></p>
    <div id="sheetBody"></div>
  </div>
</div>

          '<div><span class="ev-tag t-' + e.cat + '">' + esc(CATS[e.cat] || e.cat) + "</span></div>" +
        "</div></div>";
    }).join("");
    el("sheet").classList.add("open");
  }
  function closeSheet() { el("sheet").classList.remove("open"); }

  el("view").addEventListener("click", function (e) {
    var cell = e.target.closest("[data-day]");
    if (cell) { openDay(cell.getAttribute("data-day")); }
  });
  el("view").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") { return; }
    var cell = e.target.closest("[data-day]");
    if (cell) { e.preventDefault(); openDay(cell.getAttribute("data-day")); }
  });
  el("sheetClose").addEventListener("click", closeSheet);
  el("sheet").addEventListener("click", function (e) { if (e.target === el("sheet")) { closeSheet(); } });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { closeSheet(); return; }
    if (el("sheet").classList.contains("open")) { return; }
    if (e.key === "ArrowLeft") { el("prev").click(); }
    if (e.key === "ArrowRight") { el("next").click(); }
  });

  /* Sideways flick to change month.
     Only in the single month view: in the year view a sideways drag is just a
     drag, and the day sheet keeps its own gestures. The vertical test matters
     more than the horizontal one, because scrolling a long month is the common
     gesture and it must never be mistaken for a swipe. */
  var swipe = null;

  function slide(dir) {
    var v = el("view");
    v.classList.remove("in-next", "in-prev");
    void v.offsetWidth;                       // restart the animation
    v.classList.add(dir > 0 ? "in-next" : "in-prev");
  }

  el("view").addEventListener("pointerdown", function (e) {
    if (showAll || el("sheet").classList.contains("open")) { swipe = null; return; }
    if (e.pointerType === "mouse" && e.button !== 0) { swipe = null; return; }
    swipe = { x: e.clientX, y: e.clientY, t: Date.now() };
  });

  el("view").addEventListener("pointerup", function (e) {
    if (!swipe) { return; }
    var dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
    var ms = Date.now() - swipe.t;
    swipe = null;
    if (ms > 900) { return; }                       // a slow drag is not a flick
    if (Math.abs(dx) < 48) { return; }              // a tap, or a nudge
    if (Math.abs(dx) < Math.abs(dy) * 1.5) { return; }   // that was a scroll
    if (dx < 0 && at < months.length - 1) { at++; render(); slide(1); }
    else if (dx > 0 && at > 0) { at--; render(); slide(-1); }
  });

  el("view").addEventListener("pointercancel", function () { swipe = null; });

  /* Scrolling with the pointer over the grid pages through the months, which
     is the desktop half of the flick. Only over the grid: everything below it,
     the month written out, the legend, the notes, scrolls the page as usual,
     and so does the grid in the year view.

     A trackpad sends a long tail of small deltas for one gesture, so they are
     added up to a threshold and then ignored until the tail has died down.
     Without that, one flick would race through half the year. */
  var wheelAcc = 0, wheelUntil = 0;

  el("view").addEventListener("wheel", function (e) {
    if (showAll || el("sheet").classList.contains("open")) { return; }
    if (!e.target.closest || !e.target.closest(".grid")) { return; }
    e.preventDefault();

    var now = Date.now();
    if (now < wheelUntil) { return; }          // still the tail of the last one
    // Sideways on a trackpad, or an ordinary wheel: whichever is the stronger.
    var d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    if (!d) { return; }
    if (wheelAcc && (wheelAcc > 0) !== (d > 0)) { wheelAcc = 0; }   // turned round
    wheelAcc += d;
    if (Math.abs(wheelAcc) < 60) { return; }
    wheelAcc = 0;
    wheelUntil = now + 320;
    if (d > 0 && at < months.length - 1) { at++; render(); slide(1); }
    else if (d < 0 && at > 0) { at--; render(); slide(-1); }
  }, { passive: false });

  el("notes").innerHTML = DATA.notes.map(function (n) { return "<li>" + esc(n) + "</li>"; }).join("");
  document.title = DATA.title + " " + DATA.year + " | CJ Portal";
  render();
}());

</script>
</body>
</html>
