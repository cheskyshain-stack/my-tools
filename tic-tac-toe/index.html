<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Play Tic-Tac-Toe against a friend or against your phone. Part of CJ Portal.">
<title>Tic-Tac-Toe | CJ Portal</title>
<link rel="manifest" href="/tic-tac-toe/manifest.json">
<link rel="apple-touch-icon" href="/tic-tac-toe/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe">
<style>
  :root {
    --bg: #0f172a;
    --fg: #f8fafc;
    --board: #1e293b;
    --cell: #334155;
    --accent: #38bdf8;
    --xcolor: #22c55e;
    --ocolor: #ef4444;
  }

  body {
    font-family: "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overscroll-behavior-y: none;
    transition: 0.3s ease;
  }

  .game {
    text-align: center;
    width: 100%;
    max-width: 380px;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 20px;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--board);
    padding: 8px;
    border-radius: 16px;
    margin: 15px auto;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }

  .cell {
    aspect-ratio: 1;
    background: var(--cell);
    border-radius: 12px;
    font-size: 2.5em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s, transform 0.1s;
  }

  .cell:active { transform: scale(0.96); }
  .status { font-size: 1.1em; margin: 10px; }
  .controls button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    color: white;
    background: var(--accent);
    font-size: 15px;
    margin: 5px;
  }
</style>

<link rel="stylesheet" href="/assets/cj.css">
<style>
  :root{
    --bg:#050A18;--fg:#EDF2FF;--board:#121D38;--cell:#182747;
    --accent:#2583F7;--xcolor:#22c55e;--ocolor:#fbbf24;
  }
  body{height:auto;min-height:100vh;display:block;padding:0 14px 40px}
  .game{margin:6px auto 0}
  .mode-row{display:flex;gap:8px;justify-content:center;margin:0 0 12px}
  .mode-btn{
    flex:1;max-width:170px;padding:11px 8px;border-radius:999px;
    background:var(--cell);color:var(--fg);font-family:inherit;font-weight:700;font-size:13.5px;
    border:2px solid transparent;cursor:pointer;transition:transform .16s cubic-bezier(.22,.9,.28,1),background .16s,border-color .16s;
  }
  .mode-btn.selected{
    background:linear-gradient(140deg,#2583F7,#1763CF);color:#fff;border-color:transparent;
    box-shadow:0 10px 22px rgba(37,131,247,.3);
  }
  .mode-btn:active{transform:scale(.965)}
  .starter-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;margin:0 0 14px}
  .starter-row .starter-label{font-size:12.5px;font-weight:600;color:var(--fg);opacity:.75}
  .starter-btn{
    padding:7px 14px;border-radius:999px;background:var(--cell);color:var(--fg);
    font-family:inherit;font-weight:700;font-size:12.5px;border:2px solid transparent;
    cursor:pointer;transition:transform .16s cubic-bezier(.22,.9,.28,1),background .16s,border-color .16s;
  }
  .starter-btn.selected{background:linear-gradient(140deg,#2583F7,#1763CF);color:#fff;border-color:transparent}
  .starter-btn:active{transform:scale(.965)}
  .controls button{
    background:linear-gradient(140deg,#2583F7,#1763CF)!important;
    border-radius:999px!important;font-family:inherit;font-weight:700;color:#fff!important;
    box-shadow:0 10px 22px rgba(37,131,247,.3)!important;border:none;cursor:pointer;
    transition:transform .16s cubic-bezier(.22,.9,.28,1);
  }
  .controls button:active{transform:scale(.965)}
  .board{
    background:var(--board);border:1px solid var(--cj-line,#243044);
    border-radius:var(--cj-r-lg,22px);
    box-shadow:var(--cj-shadow,0 18px 45px rgba(0,0,0,.34))!important;
  }
  .cell{border:1px solid rgba(148,163,184,.10);border-radius:var(--cj-r-md,16px)}
  .status{color:var(--fg);font-weight:700}
</style>
</head>
<body>
<header class="cj-page-header">
  <a class="cj-brand" href="/" aria-label="CJ Portal home"><img src="/tic-tac-toe/icon.png" alt="Tic-Tac-Toe"></a>
  <h1>Tic-Tac-Toe</h1>
</header>

<div class="game">

  <div class="mode-row" id="modeRow">
    <button class="mode-btn selected" id="btnMode2p" onclick="setMode('2p')">👥 2 Players</button>
    <button class="mode-btn" id="btnModeAI" onclick="setMode('ai')">🤖 Vs Phone</button>
  </div>

  <div class="starter-row" id="starterRow" style="display:none;">
    <span class="starter-label">Who starts?</span>
    <button class="starter-btn selected" id="btnStarterX" onclick="setStarter('X')">You (X)</button>
    <button class="starter-btn" id="btnStarterO" onclick="setStarter('O')">Phone (O)</button>
  </div>

  <div class="board" id="board"></div>
  <div class="status" id="status"></div>
  <div class="controls">
    <button onclick="restart()">↻ Restart</button>
  </div>
</div>

<div id="cj-share"></div>
<script src="/assets/share-widget.js" defer></script>

<script>
  let board = Array(9).fill("");
  let current = "X";
  let mode = "2p";
  let playerSymbol = "X";
  let gameOver = false;
  const boardDiv = document.getElementById("board");
  const status = document.getElementById("status");

  function drawBoard() {
    boardDiv.innerHTML = "";
    board.forEach((v, i) => {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.textContent = v;
      cell.onclick = () => makeMove(i);
      if (v === "X") cell.style.color = "var(--xcolor)";
      if (v === "O") cell.style.color = "var(--ocolor)";
      boardDiv.appendChild(cell);
    });
  }

  function setMode(m) {
    mode = m;
    document.getElementById("btnMode2p").classList.toggle("selected", m === "2p");
    document.getElementById("btnModeAI").classList.toggle("selected", m === "ai");
    document.getElementById("starterRow").style.display = m === "ai" ? "flex" : "none";
    restart();
  }

  function setStarter(sym) {
    playerSymbol = sym;
    document.getElementById("btnStarterX").classList.toggle("selected", sym === "X");
    document.getElementById("btnStarterO").classList.toggle("selected", sym === "O");
    restart();
  }

  function makeMove(i) {
    if (board[i] !== "" || gameOver) return;
    board[i] = current;
    checkWin();
    if (!gameOver) {
      current = current === "X" ? "O" : "X";
      updateStatus();
      if (mode === "ai" && current !== playerSymbol) {
        setTimeout(aiMove, 400);
      }
    }
    drawBoard();
  }

  function aiMove() {
    let move = findBestMove();
    board[move] = current;
    checkWin();
    if (!gameOver) current = current === "X" ? "O" : "X";
    drawBoard();
    updateStatus();
  }

  function findBestMove() {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      const [a,b,c] = w;
      if (board[a]==current&&board[b]==current&&board[c]=="")return c;
      if (board[a]==current&&board[c]==current&&board[b]=="")return b;
      if (board[b]==current&&board[c]==current&&board[a]=="")return a;
    }
    let opp = current==="X"?"O":"X";
    for (let w of wins) {
      const [a,b,c] = w;
      if (board[a]==opp&&board[b]==opp&&board[c]=="")return c;
      if (board[a]==opp&&board[c]==opp&&board[b]=="")return b;
      if (board[b]==opp&&board[c]==opp&&board[a]=="")return a;
    }
    if (board[4]=="")return 4;
    const corners=[0,2,6,8].filter(i=>board[i]=="");
    if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
    const sides=[1,3,5,7].filter(i=>board[i]=="");
    return sides[Math.floor(Math.random()*sides.length)];
  }

  function checkWin() {
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      const [a,b,c]=w;
      if (board[a] && board[a]===board[b] && board[a]===board[c]) {
        gameOver = true;
        highlightWin(w);
        status.textContent = board[a]+" Wins!";
        return;
      }
    }
    if (!board.includes("") && !gameOver) {
      status.textContent = "Draw!";
      gameOver = true;
    }
  }

  function highlightWin(w) {
    const cells = document.querySelectorAll(".cell");
    w.forEach(i=>{
      cells[i].style.background="#22c55e";
      cells[i].style.color="white";
    });
  }

  function updateStatus() {
    if (gameOver) return;
    let msg = "Turn: " + current;
    if (mode==="ai" && current!==playerSymbol) msg += " (Phone)";
    status.textContent = msg;
  }

  function restart() {
    board = Array(9).fill("");
    current = "X";
    gameOver = false;
    drawBoard();
    updateStatus();
    if (mode === "ai" && playerSymbol === "O") {
      setTimeout(aiMove, 400);
    }
  }

  restart();
</script>
<script src="/assets/cj-refresh.js" defer></script>
</body>
</html>
