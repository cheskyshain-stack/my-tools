<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<meta name="description" content="Play Tic-Tac-Toe against a friend or against your phone. Part of CJ Portal.">
<title>Tic-Tac-Toe | CJ Portal</title>
<link rel="manifest" href="/tic-tac-toe/manifest.json">
<link rel="apple-touch-icon" href="/tic-tac-toe/icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tic-Tac-Toe">
<style>
  :root {
    --bg: #0f172a;
    --fg: #f8fafc;
    --board: #1e293b;
    --cell: #334155;
    --accent: #38bdf8;
    --xcolor: #22c55e;
    --ocolor: #ef4444;
  }

  body.day {
    --bg: #f8fafc;
    --fg: #0f172a;
    --board: #e2e8f0;
    --cell: #cbd5e1;
    --accent: #0284c7;
  }

  body {
    font-family: "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overscroll-behavior-y: none;
    transition: 0.3s ease;
  }

  .game {
    text-align: center;
    width: 100%;
    max-width: 380px;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 20px;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent);
  }

  .menu button {
    display: block;
    width: 85%;
    margin: 10px auto;
    font-size: 1.2em;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: 0.3s;
  }

  .menu button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 14px var(--accent);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--board);
    padding: 8px;
    border-radius: 16px;
    margin: 15px auto;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }

  .cell {
    aspect-ratio: 1;
    background: var(--cell);
    border-radius: 12px;
    font-size: 2.5em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s, transform 0.1s;
  }

  .cell:active { transform: scale(0.96); }
  .status { font-size: 1.1em; margin: 10px; }
  .controls button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    color: white;
    background: var(--accent);
    font-size: 15px;
    margin: 5px;
  }
</style>

<link rel="stylesheet" href="/assets/cj.css">
<style>
  :root{
    --bg:#050A18;--fg:#EDF2FF;--board:#121D38;--cell:#182747;
    --accent:#2583F7;--xcolor:#22c55e;--ocolor:#fbbf24;
  }
  body.day{--bg:#f5f7fc;--fg:#172033;--board:#e7ecf5;--cell:#fff;--accent:#2583F7}
  body.day{background:var(--bg)!important}
  body{height:auto;min-height:100vh;display:block;padding:0 14px 40px}
  .game{margin:6px auto 0}
  .menu button,.controls button,#starter button{
    background:linear-gradient(140deg,#2583F7,#1763CF)!important;
    border-radius:999px!important;font-family:inherit;font-weight:700;color:#fff!important;
    box-shadow:0 10px 22px rgba(37,131,247,.3)!important;border:none;cursor:pointer;
    transition:transform .16s cubic-bezier(.22,.9,.28,1);
  }
  body.day .menu button,body.day .controls button,body.day #starter button{
    background:linear-gradient(135deg,#2583F7,#1763CF)!important;color:#fff!important;
    box-shadow:0 8px 18px rgba(37,131,247,.25)!important;
  }
  .menu button:hover{transform:none!important;box-shadow:0 10px 22px rgba(0,200,255,.4)!important}
  .menu button:active,.controls button:active,#starter button:active{transform:scale(.965)}
  #starter p{color:var(--fg);font-weight:600}
  .board{
    background:var(--board);border:1px solid var(--cj-line,#243044);
    border-radius:var(--cj-r-lg,22px);
    box-shadow:var(--cj-shadow,0 18px 45px rgba(0,0,0,.34))!important;
  }
  .cell{border:1px solid rgba(148,163,184,.10);border-radius:var(--cj-r-md,16px)}
  .status{color:var(--fg);font-weight:700}
</style>
</head>
<body class="night">
<header class="cj-page-header">
  <a class="cj-brand" href="/" aria-label="CJ Portal home"><img src="/tic-tac-toe/icon.png" alt="Tic-Tac-Toe"></a>
  <h1>Tic-Tac-Toe</h1>
</header>

<div class="game">

  <div class="menu" id="menu">
    <button onclick="startMode('2p')">👥 2 Players</button>
    <button onclick="showStarter()">🤖 Play vs Phone</button>
    <button onclick="toggleMode()">🌗 Toggle Day / Night</button>
  </div>

  <div id="starter" style="display:none;">
    <p>Who should start?</p>
    <button onclick="startGame('ai','X')">🧍 You (X)</button>
    <button onclick="startGame('ai','O')">💻 Phone (O)</button>
  </div>

  <div id="gameScreen" style="display:none;">
    <div class="board" id="board"></div>
    <div class="status" id="status"></div>
    <div class="controls">
      <button onclick="restart()">↻ Restart</button>
      <button onclick="resetAll()">🏠 Menu</button>
      <button onclick="toggleMode()">🌗 Day/Night</button>
    </div>
  </div>
</div>

<script>
  let board = Array(9).fill("");
  let current = "X";
  let mode = "";
  let playerSymbol = "X";
  let gameOver = false;
  const boardDiv = document.getElementById("board");
  const status = document.getElementById("status");

  function drawBoard() {
    boardDiv.innerHTML = "";
    board.forEach((v, i) => {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.textContent = v;
      cell.onclick = () => makeMove(i);
      if (v === "X") cell.style.color = "var(--xcolor)";
      if (v === "O") cell.style.color = "var(--ocolor)";
      boardDiv.appendChild(cell);
    });
  }

  function startMode(m) {
    mode = m;
    document.getElementById("menu").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    restart();
  }

  function showStarter() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("starter").style.display = "block";
  }

  function startGame(m, starter) {
    mode = m;
    playerSymbol = starter;
    document.getElementById("starter").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    restart();
    if (mode === "ai" && playerSymbol === "O") {
      current = "X";
      setTimeout(aiMove, 400);
    }
  }

  function makeMove(i) {
    if (board[i] !== "" || gameOver) return;
    board[i] = current;
    checkWin();
    if (!gameOver) {
      current = current === "X" ? "O" : "X";
      updateStatus();
      if (mode === "ai" && current !== playerSymbol) {
        setTimeout(aiMove, 400);
      }
    }
    drawBoard();
  }

  function aiMove() {
    let move = findBestMove();
    board[move] = current;
    checkWin();
    if (!gameOver) current = current === "X" ? "O" : "X";
    drawBoard();
    updateStatus();
  }

  function findBestMove() {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      const [a,b,c] = w;
      if (board[a]==current&&board[b]==current&&board[c]=="")return c;
      if (board[a]==current&&board[c]==current&&board[b]=="")return b;
      if (board[b]==current&&board[c]==current&&board[a]=="")return a;
    }
    let opp = current==="X"?"O":"X";
    for (let w of wins) {
      const [a,b,c] = w;
      if (board[a]==opp&&board[b]==opp&&board[c]=="")return c;
      if (board[a]==opp&&board[c]==opp&&board[b]=="")return b;
      if (board[b]==opp&&board[c]==opp&&board[a]=="")return a;
    }
    if (board[4]=="")return 4;
    const corners=[0,2,6,8].filter(i=>board[i]=="");
    if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
    const sides=[1,3,5,7].filter(i=>board[i]=="");
    return sides[Math.floor(Math.random()*sides.length)];
  }

  function checkWin() {
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      const [a,b,c]=w;
      if (board[a] && board[a]===board[b] && board[a]===board[c]) {
        gameOver = true;
        highlightWin(w);
        status.textContent = board[a]+" Wins!";
        return;
      }
    }
    if (!board.includes("") && !gameOver) {
      status.textContent = "Draw!";
      gameOver = true;
    }
  }

  function highlightWin(w) {
    const cells = document.querySelectorAll(".cell");
    w.forEach(i=>{
      cells[i].style.background="#22c55e";
      cells[i].style.color="white";
    });
  }

  function updateStatus() {
    if (gameOver) return;
    let msg = "Turn: " + current;
    if (mode==="ai" && current!==playerSymbol) msg += " (Phone)";
    status.textContent = msg;
  }

  function restart() {
    board = Array(9).fill("");
    current = "X";
    gameOver = false;
    drawBoard();
    updateStatus();
  }

  function resetAll() {
    document.getElementById("menu").style.display = "block";
    document.getElementById("starter").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
  }

  function toggleMode() {
    document.body.classList.toggle("day");
  }

  drawBoard();
</script>
</body>
</html>
