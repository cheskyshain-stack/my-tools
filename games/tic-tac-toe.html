<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tic Tac Toe Deluxe</title>
<style>
  :root {
    --bg: #0f172a;
    --fg: #f8fafc;
    --board: #1e293b;
    --cell: #334155;
    --accent: #38bdf8;
    --xcolor: #22c55e;
    --ocolor: #ef4444;
  }

  body.day {
    --bg: #f8fafc;
    --fg: #0f172a;
    --board: #e2e8f0;
    --cell: #cbd5e1;
    --accent: #0284c7;
  }

  body {
    font-family: "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--fg);
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    transition: 0.3s ease;
  }

  .game {
    text-align: center;
    width: 100%;
    max-width: 380px;
  }

  h1 {
    font-size: 2em;
    margin-bottom: 20px;
    color: var(--accent);
    text-shadow: 0 0 12px var(--accent);
  }

  .menu button {
    display: block;
    width: 85%;
    margin: 10px auto;
    font-size: 1.2em;
    padding: 14px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    transition: 0.3s;
  }

  .menu button:hover {
    transform: scale(1.04);
    box-shadow: 0 0 14px var(--accent);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    background: var(--board);
    padding: 8px;
    border-radius: 16px;
    margin: 15px auto;
    box-shadow: 0 0 12px rgba(0,0,0,0.4);
  }

  .cell {
    aspect-ratio: 1;
    background: var(--cell);
    border-radius: 12px;
    font-size: 2.5em;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s, transform 0.1s;
  }

  .cell:active { transform: scale(0.96); }
  .status { font-size: 1.1em; margin: 10px; }
  .controls button {
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    color: white;
    background: var(--accent);
    font-size: 15px;
    margin: 5px;
  }
</style>

<style id="cj-apps-theme">
.cj-home{position:fixed;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));z-index:9999;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;text-decoration:none;background:linear-gradient(145deg,#2563eb,#7c3aed);box-shadow:0 8px 24px rgba(37,99,235,.34),inset 0 1px 0 rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.25);transition:transform .15s ease,box-shadow .15s ease}
.cj-home span{color:#fff;font:800 15px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:-.7px}
.cj-home:hover{transform:none;box-shadow:0 8px 24px rgba(37,99,235,.42),inset 0 1px 0 rgba(255,255,255,.3)}
.cj-home:active{transform:scale(.96)}
@media(max-width:480px){.cj-home{width:40px;height:40px;border-radius:12px}.cj-home span{font-size:14px}}
</style>
<style>:root{--bg:#0b1220;--fg:#f8fafc;--board:#172033;--cell:#24324a;--accent:#4f7cff;--xcolor:#22c55e;--ocolor:#f97316}body.day{--bg:#f5f7fb;--fg:#172033;--board:#e7ecf5;--cell:#fff;--accent:#315ee8}h1{text-shadow:none}.menu button,.controls button,#starter button{background:linear-gradient(135deg,#2563eb,#7c3aed)!important;border-radius:14px!important;box-shadow:0 8px 18px rgba(37,99,235,.22)!important}.menu button:hover{transform:none!important}.board{box-shadow:0 18px 45px rgba(2,6,23,.28)!important}</style>
</head>
<body class="night">
<a class="cj-home" href="../index.html" aria-label="Back to CJ Apps home" title="CJ Apps Home"><span>CJ</span></a>


<div class="game">
  <h1>Tic Tac Toe</h1>

  <div class="menu" id="menu">
    <button onclick="startMode('2p')">👥 2 Players</button>
    <button onclick="showStarter()">🤖 Play vs Phone</button>
    <button onclick="toggleMode()">🌗 Toggle Day / Night</button>
  </div>

  <div id="starter" style="display:none;">
    <p>Who should start?</p>
    <button onclick="startGame('ai','X')">🧍 You (X)</button>
    <button onclick="startGame('ai','O')">💻 Phone (O)</button>
  </div>

  <div id="gameScreen" style="display:none;">
    <div class="board" id="board"></div>
    <div class="status" id="status"></div>
    <div class="controls">
      <button onclick="restart()">↻ Restart</button>
      <button onclick="resetAll()">🏠 Menu</button>
      <button onclick="toggleMode()">🌗 Day/Night</button>
    </div>
  </div>
</div>

<script>
  let board = Array(9).fill("");
  let current = "X";
  let mode = "";
  let playerSymbol = "X";
  let gameOver = false;
  const boardDiv = document.getElementById("board");
  const status = document.getElementById("status");

  function drawBoard() {
    boardDiv.innerHTML = "";
    board.forEach((v, i) => {
      const cell = document.createElement("div");
      cell.classList.add("cell");
      cell.textContent = v;
      cell.onclick = () => makeMove(i);
      if (v === "X") cell.style.color = "var(--xcolor)";
      if (v === "O") cell.style.color = "var(--ocolor)";
      boardDiv.appendChild(cell);
    });
  }

  function startMode(m) {
    mode = m;
    document.getElementById("menu").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    restart();
  }

  function showStarter() {
    document.getElementById("menu").style.display = "none";
    document.getElementById("starter").style.display = "block";
  }

  function startGame(m, starter) {
    mode = m;
    playerSymbol = starter;
    document.getElementById("starter").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    restart();
    if (mode === "ai" && playerSymbol === "O") {
      current = "X";
      setTimeout(aiMove, 400);
    }
  }

  function makeMove(i) {
    if (board[i] !== "" || gameOver) return;
    board[i] = current;
    checkWin();
    if (!gameOver) {
      current = current === "X" ? "O" : "X";
      updateStatus();
      if (mode === "ai" && current !== playerSymbol) {
        setTimeout(aiMove, 400);
      }
    }
    drawBoard();
  }

  function aiMove() {
    let move = findBestMove();
    board[move] = current;
    checkWin();
    if (!gameOver) current = current === "X" ? "O" : "X";
    drawBoard();
    updateStatus();
  }

  function findBestMove() {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      const [a,b,c] = w;
      if (board[a]==current&&board[b]==current&&board[c]=="")return c;
      if (board[a]==current&&board[c]==current&&board[b]=="")return b;
      if (board[b]==current&&board[c]==current&&board[a]=="")return a;
    }
    let opp = current==="X"?"O":"X";
    for (let w of wins) {
      const [a,b,c] = w;
      if (board[a]==opp&&board[b]==opp&&board[c]=="")return c;
      if (board[a]==opp&&board[c]==opp&&board[b]=="")return b;
      if (board[b]==opp&&board[c]==opp&&board[a]=="")return a;
    }
    if (board[4]=="")return 4;
    const corners=[0,2,6,8].filter(i=>board[i]=="");
    if(corners.length)return corners[Math.floor(Math.random()*corners.length)];
    const sides=[1,3,5,7].filter(i=>board[i]=="");
    return sides[Math.floor(Math.random()*sides.length)];
  }

  function checkWin() {
    const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
      const [a,b,c]=w;
      if (board[a] && board[a]===board[b] && board[a]===board[c]) {
        gameOver = true;
        highlightWin(w);
        status.textContent = board[a]+" Wins!";
        return;
      }
    }
    if (!board.includes("") && !gameOver) {
      status.textContent = "Draw!";
      gameOver = true;
    }
  }

  function highlightWin(w) {
    const cells = document.querySelectorAll(".cell");
    w.forEach(i=>{
      cells[i].style.background="#22c55e";
      cells[i].style.color="white";
    });
  }

  function updateStatus() {
    if (gameOver) return;
    let msg = "Turn: " + current;
    if (mode==="ai" && current!==playerSymbol) msg += " (Phone)";
    status.textContent = msg;
  }

  function restart() {
    board = Array(9).fill("");
    current = "X";
    gameOver = false;
    drawBoard();
    updateStatus();
  }

  function resetAll() {
    document.getElementById("menu").style.display = "block";
    document.getElementById("starter").style.display = "none";
    document.getElementById("gameScreen").style.display = "none";
  }

  function toggleMode() {
    document.body.classList.toggle("day");
  }

  drawBoard();
</script>
</body>
</html>
