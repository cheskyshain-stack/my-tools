<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stopwatch | CJ Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="A mechanical stopwatch that sweeps round and round, ten seconds to a turn or any length you choose, for getting a feel for how long a second takes. Part of CJ Portal.">
<meta name="theme-color" content="#080b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stopwatch">
<link rel="manifest" href="/stopwatch/manifest.json">
<link rel="apple-touch-icon" href="/stopwatch/icon.png">
<style>
  :root {
    --ink: #e8e4da;
    --pad: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: #14161a;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  body {
    position: fixed;
    inset: 0;
    touch-action: manipulation;
    font-family: Georgia, "Times New Roman", serif;
    color: var(--ink);
    background:
      radial-gradient(120% 80% at 50% 0%, #262a31 0%, #14161a 60%, #0c0d10 100%);
    background-attachment: fixed;
  }

  #app {
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding:
      calc(var(--pad) + env(safe-area-inset-top))
      calc(var(--pad) + env(safe-area-inset-right))
      calc(var(--pad) + env(safe-area-inset-bottom))
      calc(var(--pad) + env(safe-area-inset-left));
    gap: var(--pad);
    position: relative;
  }

  /* The floating home logo sits over the top left corner, so in portrait the
     dial starts below it. */
  #app { padding-top: calc(var(--pad) + env(safe-area-inset-top)); }

  #dialWrap {
    flex: 1 1 auto;
    min-height: 0;
    min-width: 0;
    width: 100%;
    position: relative;
  }

  /* Absolutely placed so both percentages resolve against a definite box.
     With height:100% in normal flow, a landscape phone sized the dial from its
     width and pushed it off the top of the screen. */
  svg#watch {
    display: block;
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    width: 100%;
    filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.65));
  }

  /* A line of state under the buttons. Empty and invisible when the screen
     lock is doing its job quietly. */
  #note {
    flex: 0 0 auto;
    height: 15px;
    width: 100%;
    text-align: center;
    font: 400 12px/1.35 "Helvetica Neue", Arial, sans-serif;
    color: #8b8f97;
    opacity: 0;
    transition: opacity 300ms ease;
    pointer-events: none;
  }
  #note.show { opacity: 1; }
  #note.warn { color: #d9a273; }

  /* The screen keeper: real playing video, 2px of it, out of the way. */
  #keeper {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 2px;
    height: 2px;
    opacity: 0.02;
    pointer-events: none;
    z-index: -1;
  }

  #controls {
    flex: 0 0 auto;
    min-width: 0;
    width: 100%;
    max-width: 520px;
    display: flex;
    gap: 10px;
  }

  button.pusher {
    flex: 1 1 0;
    min-height: 62px;
    border: 1px solid #0a0b0d;
    border-radius: 12px;
    font: 600 15px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: #22262c;
    cursor: pointer;
    padding: 0;
    background:
      linear-gradient(180deg, #f2f1ee 0%, #d3d1cb 42%, #a9a7a1 58%, #cfcdc7 100%);
    box-shadow:
      inset 0 1px 0 rgba(255, 255, 255, 0.9),
      inset 0 -2px 3px rgba(0, 0, 0, 0.35),
      0 4px 0 #4a4d53,
      0 6px 12px rgba(0, 0, 0, 0.5);
    transition: transform 60ms ease, box-shadow 60ms ease;
  }

  button.pusher:active {
    transform: translateY(3px);
    box-shadow:
      inset 0 2px 5px rgba(0, 0, 0, 0.5),
      0 1px 0 #4a4d53,
      0 2px 5px rgba(0, 0, 0, 0.5);
  }

  /* The pusher that starts and stops is the one that reads coloured: green
     while it is offering to start, red while it is offering to stop. */
  button.pusher.go { color: #1c5c33; }
  button.pusher.go.running { color: #7d2018; }
  #btnReset { color: #3a3f47; }

  /* The pusher that opens the chooser is narrow: it is a setting, not an
     action, and it should not compete with Start. */
  button.pusher#btnSeconds {
    flex: 0 0 86px;
    font-size: 14px;
    letter-spacing: 0.06em;
    color: #3a3f47;
  }

  /* The chooser. Over the dial rather than beside it, because the screen is
     full by design and nothing here is allowed to scroll. */
  #picker {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));
    background: rgba(6, 7, 9, 0.74);
  }
  #picker.open { display: flex; }

  .sheet {
    width: 100%;
    max-width: 370px;
    max-height: 100%;
    overflow: auto;
    border: 1px solid #0a0b0d;
    border-radius: 16px;
    padding: 16px;
    background: linear-gradient(180deg, #23262c 0%, #171a1e 100%);
    box-shadow: 0 22px 54px rgba(0, 0, 0, 0.66);
  }
  .sheet h2 {
    margin: 0 0 4px;
    font: 600 15px/1.2 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #d3cec1;
  }
  .sheet p {
    margin: 0 0 14px;
    font: 400 12.5px/1.45 "Helvetica Neue", Arial, sans-serif;
    color: #8b8f97;
  }
  .chips {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }
  .chip {
    height: 48px;
    border: 1px solid #0a0b0d;
    border-radius: 10px;
    cursor: pointer;
    padding: 0;
    color: #22262c;
    font: 600 14px/1 "Helvetica Neue", Arial, sans-serif;
    background: linear-gradient(180deg, #efede8 0%, #bcbab4 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 2px 0 #4a4d53;
  }
  .chip:active { transform: translateY(2px); box-shadow: inset 0 2px 4px rgba(0,0,0,.45); }
  .chip.on {
    background: linear-gradient(180deg, #e6bda9 0%, #b46a54 100%);
    color: #2b120c;
  }
  .row { display: flex; gap: 8px; }
  .row input {
    flex: 1 1 auto;
    min-width: 0;
    height: 48px;
    border: 1px solid #0a0b0d;
    border-radius: 10px;
    background: #0e1013;
    color: #e8e4da;
    text-align: center;
    padding: 0 10px;
    font: 600 17px/1 "Helvetica Neue", Arial, sans-serif;
  }
  .row input:focus { outline: 2px solid #b46a54; outline-offset: 1px; }
  .row button {
    flex: 0 0 108px;
    height: 48px;
    border: 1px solid #0a0b0d;
    border-radius: 10px;
    cursor: pointer;
    color: #22262c;
    font: 600 14px/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    background: linear-gradient(180deg, #f2f1ee 0%, #b9b7b1 100%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.85), 0 2px 0 #4a4d53;
  }
  .row button:active { transform: translateY(2px); }

  /* Landscape phones: dial on the left, pushers stacked on the right. */
  @media (orientation: landscape) and (max-height: 560px) {
    #app { flex-direction: row; align-items: stretch; }
    #note {
      position: absolute;
      left: 10px;
      bottom: 6px;
      height: auto;
      width: auto;
      max-width: 60%;
      text-align: left;
    }
    /* The floating home logo sits over the top left corner, so in portrait the
     dial starts below it. */
  #app { padding-top: calc(var(--pad) + env(safe-area-inset-top)); }

  #dialWrap { width: auto; }
    #controls {
      width: auto;
      max-width: 190px;
      flex-direction: column;
      justify-content: center;
      height: 100%;
    }
    button.pusher { min-height: 0; height: 62px; }
    button.pusher#btnSeconds { flex: 0 0 auto; height: 52px; }
  }
</style>
<link rel="stylesheet" href="/assets/cj.css">
</head>
<body>
<a class="cj-float" href="/" aria-label="CJ Portal home" title="CJ Portal Home"><img src="/stopwatch/icon.png" alt="Stopwatch"></a>

<div id="app">
  <div id="dialWrap">
    <svg id="watch" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet" aria-label="Mechanical stopwatch">
      <defs>
        <linearGradient id="bezel" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0"    stop-color="#f6f6f4"/>
          <stop offset="0.14" stop-color="#8f9299"/>
          <stop offset="0.30" stop-color="#e6e7e6"/>
          <stop offset="0.46" stop-color="#6f7278"/>
          <stop offset="0.62" stop-color="#d5d7d6"/>
          <stop offset="0.78" stop-color="#7c7f85"/>
          <stop offset="1"    stop-color="#eceded"/>
        </linearGradient>

        <linearGradient id="bezelInner" x1="0" y1="1" x2="0.4" y2="0">
          <stop offset="0"    stop-color="#cfd1d1"/>
          <stop offset="0.35" stop-color="#5d6067"/>
          <stop offset="0.7"  stop-color="#c2c4c4"/>
          <stop offset="1"    stop-color="#6c6f75"/>
        </linearGradient>

        <radialGradient id="face" cx="0.42" cy="0.34" r="0.82">
          <stop offset="0"    stop-color="#fbf8f0"/>
          <stop offset="0.55" stop-color="#f0ebdd"/>
          <stop offset="0.86" stop-color="#ddd6c3"/>
          <stop offset="1"    stop-color="#c8c0aa"/>
        </radialGradient>

        <radialGradient id="cap" cx="0.35" cy="0.3" r="0.8">
          <stop offset="0"   stop-color="#fdfdfd"/>
          <stop offset="0.5" stop-color="#9a9da3"/>
          <stop offset="1"   stop-color="#43464b"/>
        </radialGradient>

        <linearGradient id="needle" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0"    stop-color="#8e1c14"/>
          <stop offset="0.55" stop-color="#c62f22"/>
          <stop offset="1"    stop-color="#e04a38"/>
        </linearGradient>

        <radialGradient id="glass" cx="0.32" cy="0.22" r="0.62">
          <stop offset="0"   stop-color="#ffffff" stop-opacity="0.30"/>
          <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.06"/>
          <stop offset="1"   stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>

        <filter id="faceShade" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
          <feOffset in="b" dx="0" dy="4" result="o"/>
          <feComposite in="o" in2="SourceAlpha" operator="out" result="ring"/>
          <feColorMatrix in="ring" type="matrix"
            values="0 0 0 0 0.18  0 0 0 0 0.15  0 0 0 0 0.10  0 0 0 0.55 0" result="sh"/>
          <feMerge>
            <feMergeNode in="SourceGraphic"/>
            <feMergeNode in="sh"/>
          </feMerge>
        </filter>

        <filter id="handShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#000" flood-opacity="0.42"/>
        </filter>
      </defs>

      <!-- case -->
      <circle cx="200" cy="200" r="197" fill="url(#bezel)"/>
      <circle cx="200" cy="200" r="197" fill="none" stroke="#26282c" stroke-width="1.4"/>
      <circle cx="200" cy="200" r="181" fill="url(#bezelInner)"/>
      <circle cx="200" cy="200" r="172" fill="#2b2d31"/>

      <!-- dial -->
      <g filter="url(#faceShade)">
        <circle cx="200" cy="200" r="169" fill="url(#face)"/>
      </g>
      <g id="guilloche" opacity="0.5"></g>
      <circle cx="200" cy="200" r="169" fill="none" stroke="#a79c81" stroke-width="0.8" opacity="0.55"/>
      <circle cx="200" cy="200" r="150" fill="none" stroke="#a79c81" stroke-width="0.7" opacity="0.45"/>

      <g id="ticks"></g>
      <g id="numerals"></g>

      <!-- lap aperture -->
      <g id="aperture">
        <rect x="167" y="243" width="66" height="30" rx="5"
              fill="#1c1a17" stroke="#8d836c" stroke-width="1.2"/>
        <text x="200" y="264" id="lapText" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif" font-size="19"
              fill="#efe7d2" letter-spacing="1">0</text>
        <text x="200" y="288" text-anchor="middle"
              font-family="Georgia, 'Times New Roman', serif" font-size="11"
              fill="#6d6350" letter-spacing="3">ROUNDS</text>
      </g>

      <text x="200" y="128" id="faceLabel" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" font-size="14"
            fill="#6d6350" letter-spacing="4">10 SECONDS</text>
      <text x="200" y="146" text-anchor="middle"
            font-family="Georgia, 'Times New Roman', serif" font-size="9.5"
            fill="#8b8067" letter-spacing="2.4">CONTINUOUS SWEEP</text>

      <!-- hand -->
      <g id="hand" filter="url(#handShadow)">
        <path d="M200 44 L203.4 196 L196.6 196 Z" fill="url(#needle)"/>
        <rect x="198.6" y="196" width="2.8" height="30" fill="#7f1a12"/>
        <circle cx="200" cy="228" r="8.5" fill="#8e1c14"/>
        <circle cx="200" cy="228" r="3.6" fill="#f0ebdd"/>
      </g>
      <circle cx="200" cy="200" r="9.5" fill="url(#cap)"/>
      <circle cx="200" cy="200" r="9.5" fill="none" stroke="#2f3237" stroke-width="0.8"/>
      <circle cx="200" cy="200" r="2.6" fill="#2b2d31"/>

      <!-- glass -->
      <circle cx="200" cy="200" r="169" fill="url(#glass)" pointer-events="none"/>
      <path d="M64 108 A169 169 0 0 1 250 40 A150 150 0 0 0 84 150 Z"
            fill="#ffffff" opacity="0.10" pointer-events="none"/>
    </svg>
  </div>

  <div id="controls">
    <button class="pusher" id="btnReset" type="button">Reset</button>
    <button class="pusher go" id="btnToggle" type="button" aria-pressed="false">Start</button>
    <button class="pusher" id="btnSeconds" type="button" aria-haspopup="dialog">10s</button>
  </div>

  <div id="note" role="status" aria-live="polite"></div>
</div>

<div id="picker" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
  <div class="sheet">
    <h2 id="pickerTitle">Once round the dial</h2>
    <p>How long the hand takes to come back to the top. The face redraws itself to
      match, so a whole second is always one numeral.</p>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input id="secInput" type="number" inputmode="numeric" min="2" max="300" step="1" aria-label="Seconds per turn">
      <button id="secApply" type="button">Set</button>
    </div>
    <p id="pickerNote" style="margin:12px 0 0"></p>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SVGNS = "http://www.w3.org/2000/svg";
  var CX = 200, CY = 200;
  var STORE = "cjStopwatchSeconds";
  var MIN_SECONDS = 2, MAX_SECONDS = 300;
  var PRESETS = [3, 5, 10, 15, 20, 30, 60, 90];

  var seconds = loadSeconds();     // how long one turn of the dial takes
  var period = seconds * 1000;

  function loadSeconds() {
    try {
      var n = Math.round(Number(localStorage.getItem(STORE)));
      if (n >= MIN_SECONDS && n <= MAX_SECONDS) { return n; }
    } catch (e) { /* private mode, or storage turned off */ }
    return 10;
  }
  function saveSeconds(n) {
    try { localStorage.setItem(STORE, String(n)); } catch (e) {}
  }

  function el(name, attrs) {
    var node = document.createElementNS(SVGNS, name);
    for (var k in attrs) { node.setAttribute(k, attrs[k]); }
    return node;
  }

  // Angles run clockwise from 12 o'clock, where 0 sits.
  function point(angleDeg, radius) {
    var rad = (angleDeg - 90) * Math.PI / 180;
    return { x: CX + radius * Math.cos(rad), y: CY + radius * Math.sin(rad) };
  }

  // Sunburst under the printing, so the dial catches light like a real face.
  var guilloche = document.getElementById("guilloche");
  for (var g = 0; g < 180; g++) {
    var a = g * 2;
    var p1 = point(a, 22), p2 = point(a, 168);
    guilloche.appendChild(el("line", {
      x1: p1.x.toFixed(2), y1: p1.y.toFixed(2),
      x2: p2.x.toFixed(2), y2: p2.y.toFixed(2),
      stroke: "#b0a48a",
      "stroke-width": 0.45,
      opacity: g % 2 ? 0.10 : 0.05
    }));
  }

  var ticks = document.getElementById("ticks");
  var numerals = document.getElementById("numerals");
  var faceLabel = document.getElementById("faceLabel");

  // Which seconds get a printed numeral. Too many and the face is unreadable,
  // so step up until there are twelve or fewer. A step that divides the turn
  // exactly is worth having, because then the gap before the 0 at the top is
  // the same as every other gap.
  function labelStep(total) {
    if (total <= 12) { return 1; }
    for (var d = 2; d <= total; d++) {
      if (total % d === 0 && total / d <= 12) { return d; }
    }
    return Math.ceil(total / 12);
  }

  // Minor ticks between the seconds, as many as fit without turning the rim
  // into a grey band. Ten seconds keeps its fifths, which is the face this
  // watch has always had.
  function minorsPerSecond(total) {
    var choices = [5, 4, 2, 1];
    for (var i = 0; i < choices.length; i++) {
      if (total * choices[i] <= 120) { return choices[i]; }
    }
    return 1;
  }

  function buildFace() {
    while (ticks.firstChild) { ticks.removeChild(ticks.firstChild); }
    while (numerals.firstChild) { numerals.removeChild(numerals.firstChild); }

    var step = labelStep(seconds);
    var per = minorsPerSecond(seconds);
    var total = seconds * per;
    var degPerTick = 360 / total;

    for (var i = 0; i < total; i++) {
      var whole = (i % per) === 0;
      var atLabel = whole && ((i / per) % step === 0);
      var outer = point(i * degPerTick, 168);
      var inner = point(i * degPerTick, atLabel ? 150 : (whole ? 156 : 160));
      ticks.appendChild(el("line", {
        x1: outer.x.toFixed(2), y1: outer.y.toFixed(2),
        x2: inner.x.toFixed(2), y2: inner.y.toFixed(2),
        stroke: atLabel ? "#2a2823" : (whole ? "#4c4638" : "#6b6353"),
        "stroke-width": atLabel ? 3.2 : (whole ? 1.8 : 1.1),
        "stroke-linecap": "butt"
      }));
    }

    var labels = [];
    for (var v = 0; v < seconds; v += step) { labels.push(v); }
    var wide = labels.some(function (v) { return v >= 100; });
    var twoDigit = labels.some(function (v) { return v >= 10; });
    var size = wide ? 25 : (twoDigit ? 30 : 34);

    labels.forEach(function (v) {
      var pt = point(v / seconds * 360, 128);
      var t = el("text", {
        x: pt.x.toFixed(2),
        y: (pt.y + (v === 0 ? 13 : 11)).toFixed(2),
        "text-anchor": "middle",
        "font-family": "Georgia, 'Times New Roman', serif",
        "font-size": v === 0 ? size + 6 : size,
        "font-weight": v === 0 ? "bold" : "normal",
        fill: v === 0 ? "#8e1c14" : "#2a2823"
      });
      t.textContent = String(v);
      numerals.appendChild(t);
    });

    faceLabel.textContent = seconds + (seconds === 1 ? " SECOND" : " SECONDS");
    document.getElementById("watch").setAttribute("aria-label",
      "Mechanical stopwatch, " + seconds + " seconds to a turn");
  }

  var hand = document.getElementById("hand");
  var lapText = document.getElementById("lapText");
  var btnToggle = document.getElementById("btnToggle");
  var btnReset = document.getElementById("btnReset");

  // One pusher does both, so its label has to say what the next press will do.
  function syncToggle() {
    btnToggle.textContent = running ? "Stop" : "Start";
    btnToggle.setAttribute("aria-pressed", running ? "true" : "false");
    btnToggle.classList.toggle("running", running);
  }

  var running = false;
  var startedAt = 0;      // performance.now() when the current run began
  var carried = 0;        // ms banked from previous runs
  var rafId = 0;
  var lastLap = -1;
  var wakeLock = null;
  var note = document.getElementById("note");
  var noteTimer = 0;

  function setNote(text, transient) {
    clearTimeout(noteTimer);
    note.textContent = text;
    note.classList.toggle("warn", Boolean(text) && !transient);
    note.classList.toggle("show", Boolean(text));
    if (text && transient) {
      noteTimer = setTimeout(function () { note.classList.remove("show"); }, 2400);
    }
  }

  function elapsed() {
    return carried + (running ? performance.now() - startedAt : 0);
  }

  function paint() {
    var ms = elapsed();
    var angle = (ms % period) / period * 360;
    hand.setAttribute("transform", "rotate(" + angle.toFixed(3) + " " + CX + " " + CY + ")");

    var lap = Math.floor(ms / period);
    if (lap !== lastLap) {
      lastLap = lap;
      lapText.textContent = String(lap);
    }
  }

  function frame() {
    paint();
    if (awakeBy === "video") { paintKeeper(); }
    rafId = requestAnimationFrame(frame);
  }

  // Keeping the screen on has two paths, because the first one is not always
  // there. navigator.wakeLock only exists in a secure context, so a page opened
  // straight off the phone (file:// or content://) or inside another app's
  // preview frame does not get it, and it fails silently.
  //
  // The fallback is the same trick a video call uses: a tiny video element
  // playing a live canvas stream. Android keeps the screen lit while a video is
  // playing, secure context or not.
  var awakeBy = "";   // "", "lock" or "video"
  var lockError = "";

  function reportAwake() {
    if (!running) { setNote(""); return; }
    if (awakeBy) { setNote("Screen kept awake", true); return; }
    setNote(lockError || "This browser will not hold the screen on");
  }

  function requestWakeLock() {
    if (!navigator.wakeLock || !navigator.wakeLock.request) {
      lockError = "No screen lock here, open the page over https";
      startVideoFallback();
      return;
    }
    if (wakeLock) { return; }
    navigator.wakeLock.request("screen").then(function (lock) {
      wakeLock = lock;
      awakeBy = "lock";
      lockError = "";
      lock.addEventListener("release", function () {
        wakeLock = null;
        if (awakeBy === "lock") { awakeBy = ""; }
        // Chrome drops the lock when the page is hidden. Take it back if the
        // watch is still running and we are looking at it again.
        if (running && document.visibilityState === "visible") { requestWakeLock(); }
      });
      reportAwake();
    }).catch(function (err) {
      lockError = "Screen lock refused (" + (err && err.name ? err.name : "error") + ")";
      startVideoFallback();
    });
  }

  // 2px of live video, parked in a corner. It has to be in the page and not
  // display:none, or the browser treats it as not playing.
  var keeperVideo = null;
  var keeperCanvas = null;
  var keeperCtx = null;
  var keeperTint = 0;

  function startVideoFallback() {
    try {
      if (!keeperVideo) {
        keeperCanvas = document.createElement("canvas");
        keeperCanvas.width = 2;
        keeperCanvas.height = 2;
        keeperCtx = keeperCanvas.getContext("2d");
        if (!keeperCanvas.captureStream) { reportAwake(); return; }

        keeperVideo = document.createElement("video");
        keeperVideo.muted = true;
        keeperVideo.defaultMuted = true;
        keeperVideo.playsInline = true;
        keeperVideo.setAttribute("muted", "");
        keeperVideo.setAttribute("playsinline", "");
        keeperVideo.setAttribute("webkit-playsinline", "");
        keeperVideo.setAttribute("disablepictureinpicture", "");
        keeperVideo.setAttribute("aria-hidden", "true");
        keeperVideo.id = "keeper";
        keeperVideo.srcObject = keeperCanvas.captureStream(5);
        document.body.appendChild(keeperVideo);
      }
      paintKeeper();
      var playing = keeperVideo.play();
      if (playing && playing.then) {
        playing.then(function () { awakeBy = "video"; reportAwake(); })
               .catch(function () { reportAwake(); });
      } else {
        awakeBy = "video";
        reportAwake();
      }
    } catch (e) {
      reportAwake();
    }
  }

  function paintKeeper() {
    if (!keeperCtx) { return; }
    // The frames have to keep changing, otherwise the stream stalls and the
    // browser stops counting it as playback.
    keeperTint = (keeperTint + 1) % 2;
    keeperCtx.fillStyle = keeperTint ? "#050608" : "#060709";
    keeperCtx.fillRect(0, 0, 2, 2);
  }

  function stopVideoFallback() {
    if (keeperVideo) { keeperVideo.pause(); }
    if (awakeBy === "video") { awakeBy = ""; }
  }

  function stayAwake() {
    lockError = "";
    requestWakeLock();
    reportAwake();
  }

  function letSleep() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
    stopVideoFallback();
    awakeBy = "";
    setNote("");
  }

  function start() {
    if (running) { return; }
    running = true;
    startedAt = performance.now();
    syncToggle();
    stayAwake();
    cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(frame);
  }

  function stop() {
    if (!running) { return; }
    carried = elapsed();
    running = false;
    syncToggle();
    letSleep();
    cancelAnimationFrame(rafId);
    rafId = 0;
    paint();
  }

  function reset() {
    var wasRunning = running;
    running = false;
    carried = 0;
    lastLap = -1;
    cancelAnimationFrame(rafId);
    rafId = 0;
    if (wasRunning) { letSleep(); }
    syncToggle();
    paint();
  }

  /* ------------------------ Choosing the turn ------------------------ */

  var picker = document.getElementById("picker");
  var chips = document.getElementById("chips");
  var secInput = document.getElementById("secInput");
  var btnSeconds = document.getElementById("btnSeconds");
  var pickerNote = document.getElementById("pickerNote");

  PRESETS.forEach(function (v) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "chip";
    b.textContent = v + "s";
    b.setAttribute("data-secs", v);
    chips.appendChild(b);
  });

  function syncChips() {
    Array.prototype.forEach.call(chips.children, function (b) {
      b.classList.toggle("on", Number(b.getAttribute("data-secs")) === seconds);
    });
    btnSeconds.textContent = seconds + "s";
    secInput.value = seconds;
    var step = labelStep(seconds);
    pickerNote.textContent = step === 1
      ? "Every second gets its own numeral."
      : "Numerals every " + step + " seconds, with a tick on each second between them.";
  }

  // Changing the length changes what a round means, so the count goes back to
  // zero rather than carrying a mix of the two. Whether it was sweeping is
  // kept: if it was running it carries on, from the top.
  function setSeconds(n) {
    n = Math.round(Number(n));
    if (!isFinite(n)) { return false; }
    if (n < MIN_SECONDS || n > MAX_SECONDS) { return false; }
    var wasRunning = running;
    seconds = n;
    period = seconds * 1000;
    saveSeconds(seconds);
    buildFace();
    syncChips();
    carried = 0;
    lastLap = -1;
    if (wasRunning) { startedAt = performance.now(); }
    paint();
    return true;
  }

  function openPicker() {
    syncChips();
    picker.classList.add("open");
  }
  function closePicker() { picker.classList.remove("open"); }

  btnSeconds.addEventListener("click", openPicker);

  chips.addEventListener("click", function (e) {
    var b = e.target.closest(".chip");
    if (!b) { return; }
    setSeconds(b.getAttribute("data-secs"));
    closePicker();
  });

  document.getElementById("secApply").addEventListener("click", function () {
    if (setSeconds(secInput.value)) {
      closePicker();
    } else {
      secInput.value = seconds;
      pickerNote.textContent = "Pick something between " + MIN_SECONDS + " and " + MAX_SECONDS + " seconds.";
    }
  });

  secInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); document.getElementById("secApply").click(); }
  });

  // Tapping the dark surround closes it. Tapping the sheet itself must not.
  picker.addEventListener("click", function (e) {
    if (e.target === picker) { closePicker(); }
  });

  btnToggle.addEventListener("click", function () { running ? stop() : start(); });
  btnReset.addEventListener("click", reset);

  // Keyboard, for testing on a desktop.
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closePicker();
      return;
    }
    // With the chooser open the keys belong to it, not to the watch.
    if (picker.classList.contains("open")) { return; }
    if (e.key === " " || e.key === "Enter") {
      e.preventDefault();
      running ? stop() : start();
    } else if (e.key.toLowerCase() === "r") {
      reset();
    } else if (e.key.toLowerCase() === "s") {
      openPicker();
    }
  });

  // Coming back from a locked screen: the hand jumps to where it should be,
  // because position is derived from the clock, not from counted frames.
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") {
      if (running) {
        stayAwake();
        cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(frame);
      }
      paint();
    }
  });

  // No pinch zoom, no rubber banding, nothing that shifts the dial.
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (e.touches.length > 1) { e.preventDefault(); }
  }, { passive: false });

  buildFace();
  syncChips();
  syncToggle();
  paint();
})();
</script>
</body>
</html>
